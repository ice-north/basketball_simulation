<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<style>
* { box-sizing: border-box; }
body { margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; background: #1a1a2e; font-family: 'Segoe UI', sans-serif; padding: 10px; }
#container { display: flex; flex-direction: column; align-items: center; gap: 8px; }
#stats { display: flex; gap: 15px; color: #fff; font-size: 11px; }
.stat-box { background: rgba(255,255,255,0.1); padding: 6px 10px; border-radius: 6px; }
#roster { display: flex; gap: 20px; margin-top: 8px; width: 1000px; }
.team-roster { flex: 1; background: rgba(255,255,255,0.05); border-radius: 8px; padding: 8px; }
.team-roster h3 { margin: 0 0 8px 0; font-size: 12px; text-align: center; }
.team-roster.blue h3 { color: #0af; }
.team-roster.red h3 { color: #f55; }
.player-row { display: flex; align-items: center; gap: 4px; margin-bottom: 4px; font-size: 10px; color: #fff; }
.player-row label { width: 28px; font-weight: bold; }
.player-row input { width: 38px; padding: 2px; border: none; border-radius: 3px; background: rgba(255,255,255,0.15); color: #fff; text-align: center; font-size: 9px; }
.player-row input:focus { outline: 1px solid #0af; background: rgba(255,255,255,0.25); }
.stat-label { font-size: 8px; color: #aaa; width: 22px; text-align: right; }
</style>
</head><body>
<div id="container">
<div id="stats">
<div class="stat-box" id="gameInfo">Q1 12:00</div>
<div class="stat-box" id="shotClock">SHOT: 24</div>
<div class="stat-box" id="possession">POSS: --</div>
</div>
<div id="game"></div>
<div id="roster">
<div class="team-roster blue"><h3>BLUE TEAM</h3><div id="blueRoster"></div></div>
<div class="team-roster red"><h3>RED TEAM</h3><div id="redRoster"></div></div>
</div>
</div>
<script>
const court = {tl:{x:175,y:250},tr:{x:825,y:250},br:{x:987.5,y:562.5},bl:{x:12.5,y:562.5}};
const cCircle = {centerCircleW:150,centerCircleH:72.5,centerCircleY:388.75};
const p7 = [{x:833.75,y:268.75},{x:740,y:278.75},{x:666.25,y:316.25},{x:642.5,y:392.5},{x:708.75,y:478.75},{x:825,y:521.25},{x:970,y:532.5}];
const paintData = {paintPoints:[{x:872.5,y:342.5},{x:912.5,y:420},{x:718.75,y:411.25},{x:708.75,y:356.25}],ftCircle:{x:715,y:383.75,w:112.5,h:53.75}};
let finalGoal = {ringX:861.25,ringY:381.25,ringZ:95,ringSize:25,poleBaseX:895,poleBaseY:345,board:[{x:900,y:346.25},{x:900,y:407.5},{x:868.75,y:370},{x:868.75,y:318.75}]};

let players = [], ball, scorePlayer = 0, scoreDefender = 0, goalChecked = false;
let gameTime = 720, quarter = 1, shotClock = 24, possession = null;
let gameState = "playing", throwInState = null;
let particles = [], floatingTexts = [];
const NET_DAMPING = 0.85, BALL_GRAVITY = 0.45, BOUNCE_FACTOR = 0.72, AIR_RESISTANCE = 0.99;
let netRight = {offsetX:0,swing:0,phase:0}, netLeft = {offsetX:0,swing:0,phase:0};
const positions = ["PG","SG","SF","PF","C"];
const SPEED_WALK = 0.3, SPEED_JOG = 0.6, SPEED_RUN = 1.0, SPEED_SPRINT = 1.5;

function setup() {
  let c = createCanvas(1000, 750);
  c.parent('game');
  initPlayers();
  ball = {x:500,y:388.75,z:0,vx:0,vy:0,vz:0,trail:[],lastTouch:"PlayerTeam",passTarget:null};
  players[0].hasBall = true; possession = "PlayerTeam";
  buildRosterUI();
}

function initPlayers() {
  for (let i = 0; i < 10; i++) {
    let team = i < 5 ? "PlayerTeam" : "DefenderTeam";
    let pos = positions[i % 5];
    players[i] = {
      id: i, team, position: pos, number: i < 5 ? (i+1)*10 : (i-4)*10+1,
      height: pos==="C" ? 210 : pos==="PF" ? 205 : pos==="SF" ? 200 : 190,
      spd: pos==="PG"?90:pos==="SG"?85:pos==="C"?60:75,
      sht: pos==="SG"?85:pos==="PG"?75:65,
      tpt: pos==="SG"?80:pos==="PG"?70:40,
      pas: pos==="PG"?85:60,
      stl: pos==="PG"?70:50,
      blk: pos==="C"?80:pos==="PF"?65:40,
      jmp: pos==="SF"?75:pos==="SG"?70:60,
      stamina: 100, maxStamina: 100, staminaDecay: 1.0,
      x: team==="PlayerTeam" ? 187.5+i*37.5 : 812.5-((i-5)*37.5), y: 350+((i%5)*43.75), z: 0, vz: 0,
      prevX: team==="PlayerTeam" ? 187.5+i*37.5 : 812.5-((i-5)*37.5),
      prevY: 350+((i%5)*43.75),
      hasBall: false, lock: 0, isJumping: false, size: 25,
      state: "idle", dribblePhase: 0, mustShoot: false, speedMultiplier: SPEED_RUN,
      moveTarget: null, actionQueue: []
    };
  }
}

function buildRosterUI() {
  let blueDiv = document.getElementById('blueRoster');
  let redDiv = document.getElementById('redRoster');
  players.forEach((p, i) => {
    let container = i < 5 ? blueDiv : redDiv;
    let row = document.createElement('div');
    row.className = 'player-row';
    row.innerHTML = `
      <label>${p.position}</label>
      <span class="stat-label">SPD</span><input type="number" min="1" max="99" value="${p.spd}" data-id="${i}" data-stat="spd">
      <span class="stat-label">SHT</span><input type="number" min="1" max="99" value="${p.sht}" data-id="${i}" data-stat="sht">
      <span class="stat-label">3PT</span><input type="number" min="1" max="99" value="${p.tpt}" data-id="${i}" data-stat="tpt">
      <span class="stat-label">PAS</span><input type="number" min="1" max="99" value="${p.pas}" data-id="${i}" data-stat="pas">
      <span class="stat-label">STL</span><input type="number" min="1" max="99" value="${p.stl}" data-id="${i}" data-stat="stl">
      <span class="stat-label">BLK</span><input type="number" min="1" max="99" value="${p.blk}" data-id="${i}" data-stat="blk">
      <span class="stat-label">STM</span><input type="number" min="50" max="200" value="${p.maxStamina}" data-id="${i}" data-stat="maxStamina">
    `;
    container.appendChild(row);
  });
  document.querySelectorAll('#roster input').forEach(inp => {
    inp.addEventListener('change', e => {
      let id = parseInt(e.target.dataset.id);
      let stat = e.target.dataset.stat;
      if(stat === 'maxStamina') {
        players[id][stat] = constrain(parseInt(e.target.value) || 100, 50, 200);
        players[id].stamina = min(players[id].stamina, players[id].maxStamina);
      } else {
        players[id][stat] = constrain(parseInt(e.target.value) || 50, 1, 99);
      }
      e.target.value = players[id][stat];
    });
  });
}

function draw() {
  background(40,40,60);
  if (frameCount % 60 === 0 && gameState === "playing" && !throwInState) {
    gameTime--; shotClock--;
    if (shotClock <= 0) shotClockViolation();
    if (gameTime <= 0) { quarter++; gameTime = 720; if(quarter>4) gameState="end"; }
  }
  updateUI();
  drawCourtAndBackboard();
  renderGoalBack(1, netRight); renderGoalBack(-1, netLeft);
  
  for (let i = 0; i < 2; i++) updatePhysics();
  players.forEach(p => { updatePlayerAI(p); updatePlayerPhysics(p); });
  
  ball.trail.push({x:ball.x,y:ball.y,z:ball.z});
  if(ball.trail.length > 15) ball.trail.shift();
  
  let entities = [...players, {isBall:true,...ball}];
  entities.sort((a,b) => a.y - b.y);
  entities.forEach(e => {
    if(e.isBall) { drawBallTrail(); drawEntity(ball.x,ball.y,ball.z,16,color(255,140,0),true); }
    else drawPlayer(e);
  });
  
  renderGoalFront(1, netRight); renderGoalFront(-1, netLeft);
  updateParticles(); updateFloatingTexts();
  drawScoreboard();
  
  if(throwInState) {
    fill(0,180); noStroke(); rect(width/2-120, height/2-25, 240, 50, 10);
    fill(255); textSize(14); textAlign(CENTER,CENTER);
    let teamName = throwInState.team === "PlayerTeam" ? "BLUE" : "RED";
    text(teamName + " BALL", width/2, height/2-8);
    textSize(11); fill(200);
    text(throwInState.reason, width/2, height/2+12);
    noFill(); stroke(255,255,0); strokeWeight(2);
    ellipse(throwInState.x, throwInState.y, 30 + sin(frameCount*0.1)*5, 15);
  }
}

function updateUI() {
  let m = floor(gameTime/60), s = gameTime%60;
  document.getElementById('gameInfo').textContent = `Q${quarter} ${m}:${s.toString().padStart(2,'0')}`;
  document.getElementById('shotClock').textContent = `SHOT: ${shotClock}`;
  document.getElementById('possession').textContent = `POSS: ${possession==="PlayerTeam"?"BLUE":possession==="DefenderTeam"?"RED":"--"}`;
}

function drawScoreboard() {
  fill(0,150); noStroke(); rect(width/2-120,10,240,45,10);
  fill(0,150,255); textSize(28); textStyle(BOLD); textAlign(RIGHT); text(scorePlayer, width/2-20, 42);
  fill(255,50,50); textAlign(LEFT); text(scoreDefender, width/2+20, 42);
  fill(255); textSize(16); textAlign(CENTER); text("-", width/2, 40);
  textSize(10); fill(0,150,255); textAlign(RIGHT); text("BLUE", width/2-55, 25);
  fill(255,50,50); textAlign(LEFT); text("RED", width/2+55, 25);
}

function drawPlayer(p) {
  let baseColor = p.team === "PlayerTeam" ? [0,150,255] : [255,50,50];
  noStroke(); fill(0,50); ellipse(p.x, p.y, p.size*1.2, p.size*0.5);
  let yOff = p.z + (p.hasBall && !p.isJumping ? sin(p.dribblePhase)*3 : 0);
  stroke(255); strokeWeight(2); fill(baseColor[0],baseColor[1],baseColor[2]);
  ellipse(p.x, p.y - yOff, p.size, p.size);
  noStroke(); fill(255); textSize(8); textAlign(CENTER,CENTER);
  text(p.position, p.x, p.y - yOff - 2);
  textSize(6); text(p.number, p.x, p.y - yOff + 6);
  let stam = p.stamina / p.maxStamina;
  fill(100); rect(p.x-12, p.y-yOff-20, 24, 3);
  fill(stam>0.5?[0,255,100]:stam>0.25?[255,200,0]:[255,50,50]);
  rect(p.x-12, p.y-yOff-20, 24*stam, 3);
  if(p.hasBall) { noFill(); stroke(255,255,0,150); strokeWeight(2); ellipse(p.x, p.y-yOff, p.size+10+sin(frameCount*0.1)*3); }
}

function drawBallTrail() {
  noFill();
  for(let i=0; i<ball.trail.length-1; i++) {
    let t = ball.trail[i], a = map(i,0,ball.trail.length,0,100);
    stroke(255,140,0,a); strokeWeight(map(i,0,ball.trail.length,2,8)); point(t.x, t.y - t.z);
  }
}

function updatePlayerPhysics(p) {
  if(p.isJumping) {
    p.vz -= BALL_GRAVITY * 0.5; p.z += p.vz;
    if(p.hasBall && p.mustShoot && p.vz <= 0) {
      let tg = p.team === "PlayerTeam" ? {x:finalGoal.ringX,y:finalGoal.ringY} : {x:800-finalGoal.ringX,y:finalGoal.ringY};
      shoot(p, tg.x, tg.y, dist(p.x,p.y,tg.x,tg.y) > 180);
    }
    if(p.z <= 0) { p.z = 0; p.vz = 0; p.isJumping = false; p.mustShoot = false; }
  }
  if(p.hasBall && !p.isJumping) p.dribblePhase += 0.3;

  // スタミナの増減: 移動距離と時間ベース
  let moveDist = dist(p.x, p.y, p.prevX, p.prevY);
  p.prevX = p.x; p.prevY = p.y;

  if(p.state === "idle") {
    p.stamina = min(p.maxStamina, p.stamina + 0.08);
  } else {
    // 移動距離に応じて減少 (距離が大きいほど減少量が大きい)
    let staminaCost = (0.005 + moveDist * 0.002) * p.staminaDecay;
    p.stamina = max(0, p.stamina - staminaCost);
  }
}

function updatePlayerAI(p) {
  // スローイン時：スロワーは指定位置へ、パスを出す。他の選手は受け取る位置へ
  if(throwInState && throwInState.thrower === p.id) {
    p.speedMultiplier = SPEED_JOG; // スローインは小走り
    moveToward(p, throwInState.x, throwInState.y, p.spd * 0.06);
    if(dist(p.x, p.y, throwInState.x, throwInState.y) < 20) {
      if(!p.hasBall) {
        p.hasBall = true; ball.x = p.x; ball.y = p.y; ball.z = 45;
      }
      // ボールを持ったら、近くの味方にパスを出す
      if(p.hasBall && frameCount % 60 > 30) {
        let teammates = players.filter(t => t.team === p.team && t.id !== p.id);
        let nearest = teammates.sort((a,b) => dist(p.x,p.y,a.x,a.y) - dist(p.x,p.y,b.x,b.y))[0];
        if(nearest && dist(p.x, p.y, nearest.x, nearest.y) < 300) {
          passTo(p, nearest);
          setTimeout(() => { if(throwInState) { possession = throwInState.team; throwInState = null; shotClock = 24; } }, 500);
        }
      }
    }
    return;
  }
  // スローイン時：スロワー以外の味方は受け取りやすい位置へ
  if(throwInState && p.team === throwInState.team && p.id !== throwInState.thrower) {
    p.speedMultiplier = SPEED_WALK; // 受け取る位置への微調整は歩き
    let thrower = players.find(pl => pl.id === throwInState.thrower);
    if(thrower) {
      // スロワーから適度な距離に移動
      let ang = atan2(p.y - thrower.y, p.x - thrower.x);
      let targetDist = 100 + (p.id % 3) * 30;
      let tx = thrower.x + cos(ang) * targetDist;
      let ty = thrower.y + sin(ang) * targetDist;
      moveToward(p, constrain(tx, 125, 875), constrain(ty, 275, 537.5), p.spd * 0.04);
    }
    return;
  }
  if(p.lock > 0) { p.lock--; }
  
  let isOffense = p.team === possession;
  let tg = p.team === "PlayerTeam" ? {x:finalGoal.ringX,y:finalGoal.ringY} : {x:1000-finalGoal.ringX,y:finalGoal.ringY};
  let og = p.team === "PlayerTeam" ? {x:1000-finalGoal.ringX,y:finalGoal.ringY} : {x:finalGoal.ringX,y:finalGoal.ringY};
  let baseSpeed = p.spd * 0.045 * (p.stamina/p.maxStamina * 0.4 + 0.6);
  let speed = baseSpeed * p.speedMultiplier;

  if(p.hasBall && p.lock <= 0) {
    p.state = "offense";
    p.speedMultiplier = SPEED_SPRINT; // ボール保持者は全速力
    let dToGoal = dist(p.x,p.y,tg.x,tg.y);
    let dominated = players.filter(d => d.team !== p.team && dist(d.x,d.y,p.x,p.y) < 40).length >= 2;
    let teammates = players.filter(t => t.team===p.team && t.id!==p.id);

    // 速攻判断：前方の敵味方の数を数える
    let forwardRange = 200;
    let enemiesForward = players.filter(d => {
      if(d.team === p.team) return false;
      let toEnemy = p.team === "PlayerTeam" ? d.x > p.x : d.x < p.x;
      return toEnemy && dist(p.x, p.y, d.x, d.y) < forwardRange;
    }).length;
    let alliesForward = teammates.filter(t => {
      let toGoal = p.team === "PlayerTeam" ? t.x > p.x : t.x < p.x;
      return toGoal && dist(p.x, p.y, t.x, t.y) < forwardRange;
    }).length;

    let outnumbered = enemiesForward - alliesForward >= 2; // 数的不利

    // 通常パス（PG優先）
    let openMate = teammates.find(t => {
      let isFree = players.filter(d => d.team !== p.team).every(d => dist(d.x,d.y,t.x,t.y) > 45);
      let closer = dist(t.x,t.y,tg.x,tg.y) < dToGoal - 30;
      return isFree && closer;
    });
    // PGが近くにいてフリーなら優先的にパス
    let pgMate = teammates.find(t => t.position === "PG" && dist(p.x, p.y, t.x, t.y) < 200);
    if(pgMate && !openMate && p.position !== "PG" && random() < 0.02) {
      let isFree = players.filter(d => d.team !== p.team).every(d => dist(d.x,d.y,pgMate.x,pgMate.y) > 40);
      if(isFree) { passTo(p, pgMate); return; }
    }
    if(openMate && random() < 0.015) { passTo(p, openMate); return; }

    // 数的不利の場合：味方を待つ（パスか安全な場所で待機）
    if(outnumbered && dToGoal > 150) {
      let safeMate = teammates.find(t => dist(p.x, p.y, t.x, t.y) < 150);
      if(safeMate && random() < 0.03) { passTo(p, safeMate); return; }
      // 後方で待機（ゆっくり移動）
      let waitX = p.team === "PlayerTeam" ? p.x - 20 : p.x + 20;
      moveToward(p, waitX, p.y, speed * 0.3);
      return;
    }

    // シュート
    if(dToGoal < 160 && random() < 0.025 && !p.isJumping) {
      p.isJumping = true; p.mustShoot = true;
      p.vz = sqrt(2 * map(p.jmp,0,100,50,100) * (BALL_GRAVITY * 0.5));
      return;
    }

    // ドライブ
    let avoidX = 0, avoidY = 0;
    players.filter(d=>d.team!==p.team).forEach(d => {
      let dd = dist(p.x,p.y,d.x,d.y);
      if(dd < 50 && dd > 0) { avoidX += (p.x-d.x)/dd*2; avoidY += (p.y-d.y)/dd*2; }
    });
    moveToward(p, tg.x + avoidX*15, tg.y + avoidY*15, speed);
    
  } else if(isOffense && p.lock <= 0) {
    p.state = "support";
    p.speedMultiplier = SPEED_RUN; // オフェンスサポートは走る
    let handler = players.find(pl=>pl.hasBall);
    if(handler) {
      // ポジション別の役割に基づいた位置取り
      let pos = p.position;
      let targetX, targetY;

      if(pos === "PG") {
        // PG: ボール運びをサポート、中盤での展開役
        // ハンドラーの少し後方で展開
        let backDist = 80;
        let ang = atan2(handler.y - tg.y, handler.x - tg.x);
        targetX = handler.x + cos(ang) * backDist;
        targetY = handler.y + sin(ang) * backDist + random(-30, 30);
      } else if(pos === "SG" || pos === "SF") {
        // SG/SF: 3ポイントライン付近（ゴールから180-220px程度）
        let idealDist = 190;
        let currentDist = dist(p.x, p.y, tg.x, tg.y);
        let ang = atan2(p.y - tg.y, p.x - tg.x);

        // 3Pライン付近に移動しつつ、左右に展開
        let spreadAng = pos === "SG" ? -PI/6 : PI/6;
        targetX = tg.x + cos(ang + spreadAng) * idealDist;
        targetY = tg.y + sin(ang + spreadAng) * idealDist;

        // ハンドラーより前方を優先
        if(p.team === "PlayerTeam" && targetX < handler.x) targetX = handler.x + 50;
        if(p.team !== "PlayerTeam" && targetX > handler.x) targetX = handler.x - 50;
      } else { // PF, C
        // PF/C: ゴール近く（100-140px程度）でリバウンド・シュートを狙う
        let idealDist = pos === "C" ? 100 : 120;
        let ang = atan2(p.y - tg.y, p.x - tg.x);

        // ペイントエリア付近に移動
        let spreadAng = pos === "PF" ? PI/4 : -PI/4;
        targetX = tg.x + cos(ang + spreadAng) * idealDist;
        targetY = tg.y + sin(ang + spreadAng) * idealDist;
      }

      // ハンドラーから離れすぎないように調整
      let distToHandler = dist(p.x, p.y, handler.x, handler.y);
      if(distToHandler > 250) {
        targetX = lerp(targetX, handler.x, 0.4);
        targetY = lerp(targetY, handler.y, 0.4);
      }

      moveToward(p, constrain(targetX,125,875), constrain(targetY,275,537.5), speed*0.8);
    } else {
      // ボール保持者がいない場合（ルーズボール）
      if(ball.z < 80 && !players.some(pl=>pl.hasBall)) {
        p.speedMultiplier = SPEED_SPRINT; // ルーズボールは全速力
        moveToward(p, ball.x, ball.y, speed);
      } else {
        // 理想的なオフェンスポジションへ移動
        p.speedMultiplier = SPEED_JOG;
        let pos = p.position;
        let idealX, idealY;
        if(pos === "PG") {
          idealX = p.team === "PlayerTeam" ? 400 : 600;
          idealY = 388.75;
        } else if(pos === "SG" || pos === "SF") {
          idealX = p.team === "PlayerTeam" ? 650 : 350;
          idealY = pos === "SG" ? 320 : 450;
        } else {
          idealX = p.team === "PlayerTeam" ? 750 : 250;
          idealY = pos === "PF" ? 340 : 430;
        }
        moveToward(p, constrain(idealX,125,875), constrain(idealY,275,537.5), speed*0.5);
      }
    }
  } else if(!isOffense) {
    p.state = "defense";
    let handler = players.find(pl=>pl.hasBall);
    let retreatX = p.team === "PlayerTeam" ? 250 : 750;
    let inPos = p.team === "PlayerTeam" ? p.x < 437.5 : p.x > 562.5;

    if(!inPos && handler) {
      p.speedMultiplier = SPEED_RUN; // 守備位置への移動は走る
      moveToward(p, retreatX, p.y, speed);
    } else if(handler) {
      p.speedMultiplier = SPEED_JOG; // マークは小走り
      // 同じポジションの相手選手をマーク
      let mark = players.filter(t=>t.team!==p.team)[p.id%5];
      if(mark) {
        // ポジション別のディフェンス重点
        let pos = p.position;
        let markWeight, goalWeight, ballWeight;

        if(pos === "PG" || pos === "SG") {
          // PG/SG: マークマンとボール保持者を重視（外周のプレッシャー）
          markWeight = 0.4;
          goalWeight = 0.3;
          ballWeight = handler.id === mark.id ? 0.5 : 0.3;
        } else if(pos === "SF") {
          // SF: バランス型
          markWeight = 0.35;
          goalWeight = 0.4;
          ballWeight = handler.id === mark.id ? 0.5 : 0.25;
        } else { // PF, C
          // PF/C: ゴールとリバウンドを重視（ペイントエリア防衛）
          markWeight = 0.25;
          goalWeight = 0.6;
          ballWeight = handler.id === mark.id ? 0.4 : 0.15;
        }

        // マークマン、ゴール、ボール保持者の3点を考慮
        let totalWeight = markWeight + goalWeight + ballWeight;
        let defX = (mark.x * markWeight + og.x * goalWeight + handler.x * ballWeight) / totalWeight;
        let defY = (mark.y * markWeight + og.y * goalWeight + handler.y * ballWeight) / totalWeight;

        // マークマンとボール保持者に近い場合は全速力
        let distToMark = dist(p.x, p.y, mark.x, mark.y);
        if(mark.hasBall && distToMark > 50) {
          p.speedMultiplier = SPEED_SPRINT;
        } else if(distToMark < 30) {
          p.speedMultiplier = SPEED_WALK; // 至近距離は歩き
        }

        moveToward(p, defX, defY, speed*0.75);
        if(mark.hasBall && dist(p.x,p.y,mark.x,mark.y) < 30 && random(100) < p.stl * 0.06 && p.lock <= 0) attemptSteal(p, mark);
      }
    } else if(ball.z < 80 && !players.some(pl=>pl.hasBall)) {
      // ルーズボール：全速力で追う
      p.speedMultiplier = SPEED_SPRINT;
      moveToward(p, ball.x, ball.y, speed);
      if(dist(p.x,p.y,ball.x,ball.y) < 25 && ball.z < 40 && p.lock <= 0) {
        p.hasBall = true; possession = p.team; shotClock = 24;
      }
    } else {
      // ボール保持者がいない場合：守備位置へ小走り
      p.speedMultiplier = SPEED_JOG;
      let pos = p.position;
      let idealX, idealY;
      if(pos === "PG" || pos === "SG") {
        idealX = p.team === "PlayerTeam" ? 300 : 700;
        idealY = pos === "PG" ? 350 : 420;
      } else if(pos === "SF") {
        idealX = p.team === "PlayerTeam" ? 250 : 750;
        idealY = 388.75;
      } else {
        idealX = p.team === "PlayerTeam" ? 200 : 800;
        idealY = pos === "PF" ? 340 : 430;
      }
      moveToward(p, constrain(idealX,125,875), constrain(idealY,275,537.5), speed*0.4);
    }
  }
}

function moveToward(p, tx, ty, spd) {
  let a = atan2(ty-p.y, tx-p.x);
  p.x = constrain(p.x + cos(a)*spd, 25, 975);
  p.y = constrain(p.y + sin(a)*spd, 262.5, 550);
}

function passTo(passer, receiver) {
  passer.hasBall = false; passer.lock = 20;
  let d = dist(passer.x, passer.y, receiver.x, receiver.y);
  let spd = map(passer.pas, 0, 100, 5, 9), t = d / spd;
  ball.vx = (receiver.x - ball.x) / t;
  ball.vy = (receiver.y - ball.y) / t;
  ball.vz = map(d, 50, 300, 1.5, 4) + (BALL_GRAVITY * t * 0.2);
  ball.passTarget = receiver.id; ball.lastTouch = passer.team;
  for(let i=0;i<5;i++) particles.push({x:passer.x,y:passer.y-passer.z,vx:random(-1,1),vy:random(-2,0),life:20,color:[255,255,200]});
}

function shoot(s, tx, ty, is3pt) {
  s.hasBall = false; s.mustShoot = false; goalChecked = false; s.lock = 60;
  let d = dist(s.x, s.y, tx, ty), t = map(d, 50, 300, 28, 45);
  let acc = is3pt ? s.tpt : s.sht;
  let err = map(acc, 0, 100, 14, 1.5) * (s.stamina/s.maxStamina * 0.3 + 0.7);
  ball.vx = (tx + (s.team==="PlayerTeam"?5:-5) + random(-err, err) - ball.x) / t;
  ball.vy = (ty + random(-err*0.4, err*0.4) - ball.y) / t;
  ball.vz = (finalGoal.ringZ - ball.z + 0.5 * BALL_GRAVITY * t * t) / t;
  ball.shooterTeam = s.team; ball.is3pt = is3pt; ball.lastTouch = s.team; ball.passTarget = null;
  for(let i=0;i<8;i++) particles.push({x:s.x,y:s.y-s.z-20,vx:random(-2,2),vy:random(-3,0),life:25,color:[255,255,0]});
}

function attemptSteal(stealer, handler) {
  if(random(100) < stealer.stl - handler.pas * 0.3) {
    handler.hasBall = false; stealer.hasBall = true;
    possession = stealer.team; shotClock = 24;
    addFloatingText(stealer.x, stealer.y - 40, "STEAL!", [0,255,100]);
  }
  stealer.lock = 40;
}

function shotClockViolation() {
  let newTeam = possession === "PlayerTeam" ? "DefenderTeam" : "PlayerTeam";
  let holder = players.find(p=>p.hasBall); if(holder) holder.hasBall = false;
  let thX = possession === "PlayerTeam" ? 937.5 : 62.5;
  let thrower = players.find(p => p.team === newTeam && p.position === "PG");
  throwInState = { team: newTeam, x: thX, y: 406.25, reason: "SHOT CLOCK VIOLATION", thrower: thrower ? thrower.id : (newTeam==="PlayerTeam"?0:5) };
  ball.vx = 0; ball.vy = 0; ball.vz = 0;
  addFloatingText(500, 350, "24 SEC VIOLATION", [255,100,100]);
}

function startThrowIn(team, x, y, reason) {
  let holder = players.find(p=>p.hasBall); if(holder) holder.hasBall = false;
  let thrower = players.find(p => p.team === team && p.position === "PG");
  throwInState = { team, x, y, reason, thrower: thrower ? thrower.id : (team==="PlayerTeam"?0:5) };
  ball.vx = 0; ball.vy = 0; ball.vz = 0;
}

function checkRebound(side) {
  let rx = side === 1 ? finalGoal.ringX : 1000 - finalGoal.ringX, ry = finalGoal.ringY, rz = finalGoal.ringZ, rs = finalGoal.ringSize / 2;
  let boardX = side === 1 ? 893.75 : 106.25;
  if(ball.x > boardX - 12 && ball.x < boardX + 12 && ball.y > 287.5 && ball.y < 468.75 && ball.z < 180 && ball.z > 60) {
    ball.vx = -ball.vx * BOUNCE_FACTOR; ball.x = ball.x > boardX ? boardX + 13 : boardX - 13;
    ball.vz *= 0.9; ball.vy *= 0.9;
  }
  let d = dist(ball.x, ball.y, rx, ry);
  if(abs(ball.z - rz) < 12 && d > rs - 8 && d < rs + 10) {
    let ang = atan2(ball.y - ry, ball.x - rx), spH = sqrt(ball.vx*ball.vx + ball.vy*ball.vy);
    ball.vx = cos(ang) * (spH * BOUNCE_FACTOR + 1.5);
    ball.vy = sin(ang) * (spH * BOUNCE_FACTOR + 1.5);
    ball.vz = ball.vz < 0 ? abs(ball.vz) * BOUNCE_FACTOR + 1.5 : ball.vz * BOUNCE_FACTOR;
    goalChecked = false;
  }
}

function updatePhysics() {
  if(throwInState) return;
  let holder = players.find(p => p.hasBall);
  if(holder) {
    let dZ = holder.isJumping ? 0 : abs(sin(holder.dribblePhase)) * 20;
    ball.x = holder.x; ball.y = holder.y; ball.z = holder.z + 45 - dZ;
    ball.vx = 0; ball.vy = 0; ball.vz = 0; ball.passTarget = null; ball.lastTouch = holder.team;
  } else {
    // 重力の適用
    ball.vz -= BALL_GRAVITY * 0.5;

    // 空気抵抗の適用
    ball.vx *= AIR_RESISTANCE;
    ball.vy *= AIR_RESISTANCE;
    ball.vz *= AIR_RESISTANCE;

    // 位置の更新
    ball.x += ball.vx * 0.5;
    ball.y += ball.vy * 0.5;
    ball.z += ball.vz * 0.5;

    // パスターゲットへのキャッチ判定
    if(ball.passTarget !== null) {
      let rcv = players[ball.passTarget];
      if(rcv && dist(rcv.x, rcv.y, ball.x, ball.y) < 35 && ball.z < 60) {
        rcv.hasBall = true;
        ball.passTarget = null;
      }
    }

    // 地面との衝突
    if(ball.z <= 0) {
      ball.z = 0;
      ball.vz *= -0.55;
      ball.vx *= 0.95;
      ball.vy *= 0.95;
      goalChecked = false;
    }

    checkRebound(1); checkRebound(-1);
    
    let oob = false, thX = ball.x, thY = ball.y;
    if(ball.y < 250 || ball.y > 562.5) { oob = true; thY = ball.y < 250 ? 256.25 : 556.25; thX = constrain(ball.x, 62.5, 937.5); }
    if(ball.x < 12.5 || ball.x > 987.5) { oob = true; thX = ball.x < 12.5 ? 18.75 : 981.25; thY = constrain(ball.y, 275, 537.5); }
    if(oob && ball.z < 30) {
      let newTeam = ball.lastTouch === "PlayerTeam" ? "DefenderTeam" : "PlayerTeam";
      startThrowIn(newTeam, thX, thY, "OUT OF BOUNDS");
      addFloatingText(500, 375, "OUT OF BOUNDS", [255,255,255]);
    }
  }
  netRight.offsetX *= NET_DAMPING; netRight.swing *= NET_DAMPING; netRight.phase += 0.08;
  netLeft.offsetX *= NET_DAMPING; netLeft.swing *= NET_DAMPING; netLeft.phase += 0.08;
  checkGoal(1, netRight); checkGoal(-1, netLeft);
}

function checkGoal(side, net) {
  let rx = side === 1 ? finalGoal.ringX : 1000 - finalGoal.ringX;
  let d = dist(ball.x, ball.y, rx, finalGoal.ringY);
  if(ball.vz < 0 && ball.z < finalGoal.ringZ && ball.z > finalGoal.ringZ - 20 && d < finalGoal.ringSize / 1.1) {
    net.offsetX = ball.vx * 1.5; net.swing = 10; net.phase = 0;
    // 網による減速
    ball.vz *= 0.65;
    if(!goalChecked && ball.z < finalGoal.ringZ - 5) {
      let pts = ball.is3pt ? 3 : 2;
      if(side === 1) scorePlayer += pts; else scoreDefender += pts;
      goalChecked = true;
      for(let i=0;i<30;i++) particles.push({x:rx,y:finalGoal.ringY,vx:random(-5,5),vy:random(-5,5),life:60,color:side===1?[0,150,255]:[255,50,50]});
      addFloatingText(rx, finalGoal.ringY - 50, ball.is3pt ? "+3!" : "+2!", side===1?[0,200,255]:[255,100,100]);
      let newTeam = side === 1 ? "DefenderTeam" : "PlayerTeam";
      let thX = side === 1 ? 975 : 25;
      setTimeout(() => startThrowIn(newTeam, thX, 406.25, "INBOUND"), 1000);
    }
  }
}

function updateParticles() {
  for(let i=particles.length-1; i>=0; i--) {
    let p = particles[i]; p.x += p.vx; p.y += p.vy; p.vy += 0.1; p.life--;
    noStroke(); fill(p.color[0],p.color[1],p.color[2],p.life*4);
    ellipse(p.x, p.y, map(p.life,0,60,2,8));
    if(p.life <= 0) particles.splice(i,1);
  }
}

function addFloatingText(x, y, txt, col) { floatingTexts.push({x,y,txt,col,life:60}); }

function updateFloatingTexts() {
  for(let i=floatingTexts.length-1; i>=0; i--) {
    let t = floatingTexts[i]; t.y -= 1; t.life--;
    fill(t.col[0],t.col[1],t.col[2],t.life*4);
    noStroke(); textSize(16); textStyle(BOLD); textAlign(CENTER); text(t.txt, t.x, t.y);
    if(t.life <= 0) floatingTexts.splice(i,1);
  }
}

function drawEntity(x, y, z, s, c, isBall) {
  noStroke(); fill(0, 50); ellipse(x, y, s * 1.2, s * 0.5);
  fill(c); stroke(255); strokeWeight(1); ellipse(x, y - z, s, s);
  if(isBall) { stroke(0,50); strokeWeight(1); line(x-s/3, y-z, x+s/3, y-z); }
}

function drawCourtAndBackboard() {
  fill(180,150,110); stroke(255); strokeWeight(3);
  beginShape(); for(let pt of [court.tl,court.tr,court.br,court.bl]) vertex(pt.x,pt.y); endShape(CLOSE);
  stroke(255,200,0,100); strokeWeight(4);
  drawSpline(p7); drawSpline(p7.map(pt=>({x:1000-pt.x,y:pt.y})));
  noFill(); stroke(255); strokeWeight(2);
  line(500,250,500,562.5);
  ellipse(500, cCircle.centerCircleY, cCircle.centerCircleW, cCircle.centerCircleH);
  drawPaintSet(1); drawPaintSet(-1);
  stroke(255); strokeWeight(2);
  drawSpline(p7); drawSpline(p7.map(pt=>({x:1000-pt.x,y:pt.y})));
  renderBackboardAndPole(1); renderBackboardAndPole(-1);
}

function drawPaintSet(side) {
  let pts = paintData.paintPoints.map(pt => side===1 ? pt : {x:1000-pt.x,y:pt.y});
  stroke(255); strokeWeight(2); fill(180,100,100,30);
  beginShape(); for(let pt of pts) vertex(pt.x,pt.y); endShape(CLOSE);
  noFill();
  let cX = side===1 ? paintData.ftCircle.x : 1000-paintData.ftCircle.x;
  arc(cX, paintData.ftCircle.y, paintData.ftCircle.w, paintData.ftCircle.h, side===1?HALF_PI:-HALF_PI, side===1?-HALF_PI:HALF_PI);
}

function drawSpline(pts) {
  beginShape(); curveVertex(pts[0].x,pts[0].y);
  for(let pt of pts) curveVertex(pt.x,pt.y);
  curveVertex(pts[pts.length-1].x,pts[pts.length-1].y); endShape();
}

function renderBackboardAndPole(side) {
  let g = finalGoal, rx = side===1 ? g.poleBaseX : 1000-g.poleBaseX;
  stroke(100); strokeWeight(5); line(rx,g.poleBaseY,rx,g.poleBaseY-95);
  let bPts = g.board.map(pt=>({x:side===1?pt.x:1000-pt.x,y:pt.y-95}));
  fill(255,220); stroke(255); strokeWeight(2);
  beginShape(); for(let pt of bPts) vertex(pt.x,pt.y); endShape(CLOSE);
}

function drawNetGemini(rx,ry,rz,net,isBack) {
  let swX = (net.offsetX + sin(net.phase)*net.swing)*0.8;
  let seg = 4, vL = 12; stroke(255,180); strokeWeight(1); noFill();
  for(let j=0; j<vL; j++) {
    let ang = map(j,0,vL,0,TWO_PI);
    if(isBack && ang > 0 && ang < PI) continue;
    if(!isBack && ang >= PI && ang <= TWO_PI) continue;
    beginShape();
    for(let i=0; i<=seg; i++) {
      let pr = i/seg, w = (finalGoal.ringSize/2)*(1-pr*0.3), h = (finalGoal.ringSize*0.2)*(1-pr*0.3);
      vertex(rx+cos(ang)*w+(swX*pr), ry-rz+i*4.5+sin(ang)*h);
    } endShape();
  }
  let sA = isBack ? PI : 0, eA = isBack ? TWO_PI : PI;
  for(let i=1; i<=seg; i++) {
    let pr = i/seg, w = finalGoal.ringSize*(1-pr*0.3), h = finalGoal.ringSize*0.4*(1-pr*0.3);
    arc(rx+(swX*pr), ry-rz+i*4.5, w, h, sA, eA);
  }
}

function renderGoalBack(side, net) {
  let g = finalGoal, rx = side===1 ? g.ringX : 1000-g.ringX;
  noStroke(); fill(0,40); ellipse(rx,g.ringY,g.ringSize,g.ringSize*0.4);
  stroke(255,50,50); strokeWeight(3); noFill();
  arc(rx, g.ringY-g.ringZ, g.ringSize, g.ringSize*0.4, PI, TWO_PI);
  drawNetGemini(rx, g.ringY, g.ringZ, net, true);
}

function renderGoalFront(side, net) {
  let g = finalGoal, rx = side===1 ? g.ringX : 1000-g.ringX;
  stroke(255,50,50); strokeWeight(3); noFill();
  arc(rx, g.ringY-g.ringZ, g.ringSize, g.ringSize*0.4, 0, PI);
  drawNetGemini(rx, g.ringY, g.ringZ, net, false);
}
