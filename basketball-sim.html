// Validate player ID is within bounds and alive
function isValidPlayerId(id) {
  return id !== null && id !== undefined &&
         id >= 0 && id < players.length &&
         players[id] !== null && players[id] !== undefined;
}

// Get player by ID safely
function getPlayer(id) {
  return isValidPlayerId(id) ? players[id] : null;
}

// Safe distance calculation with epsilon
function safeDist(x1, y1, x2, y2) {
  let dx = x2 - x1;
  let dy = y2 - y1;
  let d = Math.sqrt(dx * dx + dy * dy);
  return Math.max(d, 0.001); // Prevent zero
}

function draw() {
  background(40,40,60);

  // ジャンプボール中は時間を止める（速度倍率対応）
  if (frameCount % Math.floor(60 / gameSpeed) === 0 && gameState === "playing" && !throwInState && !jumpBallState) {
    gameTime--; shotClock--;
    if (shotClock <= 0) shotClockViolation();
    if (gameTime <= 0) {
      quarter++; gameTime = 720;
      if(quarter > 4) { gameState = "end"; }
      else {
        // クォーター間：ジャンプボール
        let holder = players.find(p=>p.hasBall); if(holder) holder.hasBall = false;
        teamFouls.PlayerTeam = 0; teamFouls.DefenderTeam = 0; // クォーターファウルリセット
        startJumpBall();
      }
    }
  }
  updateUI();
  drawCourtAndBackboard();
  renderGoalBack(1, netRight); renderGoalBack(-1, netLeft);

  // フリースロー処理
  if(foulState && foulState.currentAttempt === 0 && frameCount % 120 === 0) {
    executeFreeThrow();
  }

  // ジャンプボール処理（速度倍率対応）
  if(jumpBallState) {
    for (let g = 0; g < gameSpeed; g++) updateJumpBall();
  } else if(!foulState) {
    for (let g = 0; g < gameSpeed; g++) {
      for (let i = 0; i < 2; i++) updatePhysics();
      players.forEach(p => { updatePlayerAI(p); updatePlayerPhysics(p); });
    }

    // 古いスクリーンとカットをクリーンアップ
    screens = screens.filter(s => frameCount - s.startTime < 300);
    cuts = cuts.filter(c => frameCount - c.startTime < 180);
  }
  ball.trail.push({x:ball.x,y:ball.y,z:ball.z});
  if(ball.trail.length > 15) ball.trail.shift();
  let entities = [...players, {isBall:true,...ball}];
  entities.sort((a,b) => a.y - b.y);
  entities.forEach(e => {
    if(e.isBall) { drawBallTrail(); drawEntity(ball.x,ball.y,ball.z,16,color(255,140,0),true); }
    else drawPlayer(e);
  });
  renderGoalFront(1, netRight); renderGoalFront(-1, netLeft);
  updateParticles(); updateFloatingTexts();
  drawScoreboard();
  if(throwInState) {
  // OPUS FIX: Validate thrower exists
  if(!isValidPlayerId(throwInState.thrower)) {
    throwInState = null; // Invalid state
  } else {
    fill(0,180); noStroke(); rect(width/2-120, height/2-25, 240, 50, 10);
    fill(255); textSize(14); textAlign(CENTER,CENTER);
    let teamName = throwInState.team === "PlayerTeam" ? "BLUE" : "RED";
    text(teamName + " BALL", width/2, height/2-8);
    textSize(11); fill(200);
    text(throwInState.reason, width/2, height/2+12);
    noFill(); stroke(255,255,0); strokeWeight(2);
    ellipse(throwInState.x, throwInState.y, 30 + sin(frameCount*0.1)*5, 15);
  }}
}

function updateUI() {
  let m = floor(gameTime/60), s = gameTime%60;
  document.getElementById('gameInfo').textContent = `Q${quarter} ${m}:${s.toString().padStart(2,'0')}`;
  document.getElementById('shotClock').textContent = `SHOT: ${shotClock}`;
  document.getElementById('possession').textContent = `POSS: ${possession==="PlayerTeam"?"BLUE":possession==="DefenderTeam"?"RED":"--"}`;
}

function drawScoreboard() {
  // NBA-STYLE SCOREBOARD REDESIGN
  push();

  // Main scoreboard background (gradient)
  let sbX = width/2 - 200;
  let sbY = 15;
  let sbW = 400;
  let sbH = 80;

  // Gradient background
  for(let i = 0; i < sbH; i++) {
    let inter = map(i, 0, sbH, 0, 1);
    let c = lerpColor(color(20, 20, 25), color(10, 10, 15), inter);
    stroke(c);
    line(sbX, sbY + i, sbX + sbW, sbY + i);
  }

  // Border
  noFill();
  stroke(100, 100, 120);
  strokeWeight(2);
  rect(sbX, sbY, sbW, sbH, 5);

  // Team sections
  let teamW = 160;
  let teamH = 70;
  let teamY = sbY + 5;

  // BLUE team (left)
  let blueX = sbX + 10;
  fill(0, 100, 200, 180);
  noStroke();
  rect(blueX, teamY, teamW, teamH, 3);

  // BLUE team border
  stroke(0, 150, 255);
  strokeWeight(2);
  noFill();
  rect(blueX, teamY, teamW, teamH, 3);

  // BLUE team name
  fill(255);
  textAlign(CENTER, CENTER);
  textSize(16);
  textFont('Arial Black');
  text("BLUE", blueX + teamW/2, teamY + 15);

  // BLUE score
  textSize(36);
  textFont('Arial');
  text(scorePlayer, blueX + teamW/2, teamY + 48);

  // RED team (right)
  let redX = sbX + sbW - teamW - 10;
  fill(200, 30, 30, 180);
  noStroke();
  rect(redX, teamY, teamW, teamH, 3);

  // RED team border
  stroke(255, 50, 50);
  strokeWeight(2);
  noFill();
  rect(redX, teamY, teamW, teamH, 3);

  // RED team name
  fill(255);
  textAlign(CENTER, CENTER);
  textSize(16);
  textFont('Arial Black');
  text("RED", redX + teamW/2, teamY + 15);

  // RED score
  textSize(36);
  textFont('Arial');
  text(scoreDefender, redX + teamW/2, teamY + 48);

  // Center info panel
  let centerX = sbX + teamW + 20;
  let centerW = sbW - teamW * 2 - 40;

  // Quarter
  fill(255, 215, 0);
  textSize(14);
  textFont('Arial Black');
  textAlign(CENTER, CENTER);
  text("Q" + quarter, centerX + centerW/2, teamY + 12);

  // Game clock
  let m = floor(gameTime/60);
  let s = gameTime % 60;
  fill(255);
  textSize(20);
  textFont('Courier New');
  text(m + ":" + (s < 10 ? "0" : "") + s, centerX + centerW/2, teamY + 35);

  // Shot clock
  fill(shotClock <= 5 ? color(255, 100, 100) : color(150, 255, 150));
  textSize(16);
  textFont('Arial');
  text("SHOT: " + shotClock, centerX + centerW/2, teamY + 58);

  pop();

  // Quarter scores (vertical layout below main scoreboard)
  push();
  let qX = width/2;
  let qStartY = sbY + sbH + 10;
  let qSpacing = 16;

  textFont('sans-serif');
  textSize(11);

  for(let i = 0; i < 4; i++) {
    let qY = qStartY + i * qSpacing;

    // Current quarter highlight
    let isCurrentQ = i === quarter - 1;

    // BLUE score (left)
    let blueQ = quarterScoresPlayer[i] || 0;
    let blueColor = isCurrentQ ? [0, 200, 255] : [100, 150, 180];
    fill(blueColor[0], blueColor[1], blueColor[2]);
    textAlign(RIGHT, CENTER);
    text(blueQ, qX - 25, qY);

    // Quarter number (center)
    fill(isCurrentQ ? color(255, 215, 0) : color(120, 120, 130));
    textAlign(CENTER, CENTER);
    textSize(isCurrentQ ? 12 : 10);
    text("Q" + (i + 1), qX, qY);

    // RED score (right)
    let redQ = quarterScoresDefender[i] || 0;
    let redColor = isCurrentQ ? [255, 80, 80] : [180, 100, 100];
    fill(redColor[0], redColor[1], redColor[2]);
    textAlign(LEFT, CENTER);
    textSize(11);
    text(redQ, qX + 25, qY);
  }

  pop();
}

function drawPlayer(p) {
  let baseColor = p.team === "PlayerTeam" ? [0,150,255] : [255,50,50];
  let darkColor = p.team === "PlayerTeam" ? [0,100,200] : [200,30,30];

  // 影（リアル・動的）- 足元に表示
  let shadowSize = p.size * 1.3 + p.z * 0.15;
  let shadowAlpha = 60 - p.z * 0.3;
  noStroke(); fill(0, 0, 0, shadowAlpha);
  ellipse(p.x, p.y + 12, shadowSize, shadowSize * 0.4); // Y座標を+12して足元に表示

  let yOff = p.z + (p.hasBall && !p.isJumping ? sin(p.dribblePhase)*2 : 0);
  let px = p.x, py = p.y - yOff;

  // ボール保持者のグロー効果
  if(p.hasBall) {

    noStroke();
    fill(baseColor[0], baseColor[1], baseColor[2], 40);
    ellipse(px, py, p.size + 8, p.size + 8);
  }

  // 体（楕円＋方向表示）
  stroke(darkColor[0],darkColor[1],darkColor[2]); strokeWeight(2);
  fill(baseColor[0],baseColor[1],baseColor[2]);
  ellipse(px, py, p.size, p.size);

  // 方向を示す小さな三角（進行方向）
  if(p.currentSpeed > 0.3) {
    let dirX = cos(p.facingAngle) * 11;
    let dirY = sin(p.facingAngle) * 5;
    noStroke(); fill(255,255,255,120);
    triangle(px+dirX, py+dirY, px+dirX*0.3-dirY*0.4, py+dirY*0.3+dirX*0.08, px+dirX*0.3+dirY*0.4, py+dirY*0.3-dirX*0.08);
  }

  // ドリブルの腕の表現（進行方向横にボールを突く動き）
  if(p.hasBall && !p.isJumping && p.currentSpeed > 0.3) {
    let armX = cos(p.facingAngle) * 8;
    let armY = sin(p.facingAngle) * 4;
    stroke(baseColor[0]+40,baseColor[1]+40,baseColor[2]+40); strokeWeight(2);
    line(px, py, px + armX, py + armY + sin(p.dribblePhase) * 2);
  }

  // ポジション・背番号
  noStroke(); fill(255); textSize(8); textAlign(CENTER,CENTER);
  text(p.position, px, py - 3);
  textSize(6); fill(255,255,255,200); text(p.number, px, py + 6);

  // スタミナバー
  let stam = p.stamina / p.maxStamina;
  fill(30,30,30,150); rect(px-12, py-20, 24, 3, 1);
  let stColor = stam>0.5?[0,230,80]:stam>0.25?[255,180,0]:[255,40,40];
  fill(stColor[0],stColor[1],stColor[2]); rect(px-12, py-20, 24*stam, 3, 1);

  // ボール保持者のハイライト
  if(p.hasBall) {
    noFill(); stroke(255,255,0,100+sin(frameCount*0.15)*50); strokeWeight(2);
    ellipse(px, py, p.size+8+sin(frameCount*0.1)*3);
  }

  // ジャンプ中の高さ表示（ジャンプが見える）
  if(p.isJumping && p.z > 5) {
    stroke(255,255,255,60); strokeWeight(1);
    line(p.x, p.y, p.x, p.y - p.z);
  }



  // Countdown switch timer
  if(p.switchTimer && p.switchTimer > 0) {
    p.switchTimer--;
    if(p.switchTimer <= 0) {
      p.switchedDefense = null;
    }
  }

  // Defensive switching on screens (NBA fundamental)
  if(p.team !== ball.lastTouch) { // Defender
    let nearScreens = players.filter(s =>
      s.team !== p.team && s.isScreening &&
      dist(p.x, p.y, s.x, s.y) < 40
    );
    if(nearScreens.length > 0) {
      // Switch assignment temporarily
      let screener = nearScreens[0];
      if(!p.switchedDefense) {
        p.switchedDefense = screener;
        // Switch for 3 seconds
        p.switchTimer = 180; // 3 seconds = 180 frames
      }
    }
  }

  // スクリーン中の表示
  if(p.isScreening) {
    noFill(); stroke(255,200,0,80); strokeWeight(3);
    arc(px, py, p.size+14, p.size+14, 0, PI);
  }
}

function drawBallTrail() {
  noFill();
  for(let i=0; i<ball.trail.length-1; i++) {
    let t = ball.trail[i], a = map(i,0,ball.trail.length,0,100);
    stroke(255,140,0,a); strokeWeight(map(i,0,ball.trail.length,2,8)); point(t.x, t.y - t.z);
  }
}

function updatePlayerPhysics(p) {
  if(p.isJumping) {
    p.vz -= BALL_GRAVITY * 0.5; p.z += p.vz;

    // Lock horizontal position during jump to prevent mid-air direction changes
    if(!p.jumpStartX) {
      p.jumpStartX = p.x;
      p.jumpStartY = p.y;
    }
    // Prevent horizontal movement during jump
    if(p.hasBall) {
      // Allow minimal forward drift for shooting motion
      let maxDrift = 5;
      p.x = constrain(p.x, p.jumpStartX - maxDrift, p.jumpStartX + maxDrift);
      p.y = constrain(p.y, p.jumpStartY - maxDrift, p.jumpStartY + maxDrift);
    } else {
      // No movement for non-ball handlers
      p.x = p.jumpStartX;
      p.y = p.jumpStartY;
    }

    if(p.hasBall && p.mustShoot && p.vz <= 0) {
      // シュート前にブロック判定
      let nearBlocker = players.find(d => d.team !== p.team && (d.position === "C" || d.position === "PF") && dist(d.x,d.y,p.x,p.y) < 40 && d.lock <= 0);
      if(nearBlocker) attemptBlock(nearBlocker, p);
      if(p.hasBall) { // ブロックされなかった場合のみシュート
        let tg = p.team === "PlayerTeam" ? {x:finalGoal.ringX,y:finalGoal.ringY} : {x:1000-finalGoal.ringX,y:finalGoal.ringY};
        shoot(p, tg.x, tg.y, dist(p.x,p.y,tg.x,tg.y) > 180);
      }
    }
    if(p.z <= 0) {
      p.z = 0; p.vz = 0; p.isJumping = false; p.mustShoot = false;
      // Clear jump position locks
      p.jumpStartX = null;
      p.jumpStartY = null;
    }
  }
  if(p.hasBall && !p.isJumping) p.dribblePhase += 0.2; // ドリブル速度（遅く）

  // スタミナの増減: 移動距離と時間ベース
  let moveDist = dist(p.x, p.y, p.prevX, p.prevY);
  p.prevX = p.x; p.prevY = p.y;

  if(p.state === "idle") {
    // 回復力が高いほどスタミナ回復が早い
    let recoveryRate = map(p.recovery, 0, 100, 0.04, 0.12);
    p.stamina = min(p.maxStamina, p.stamina + recoveryRate);
  } else {
    // 移動距離に応じて減少 (1/5に調整)
    let staminaCost = (0.001 + moveDist * 0.0004) * p.staminaDecay;
    p.stamina = max(0, p.stamina - staminaCost);
  }
}

// === AI意思決定システム ===

// ゲーム状況を評価
function evaluateGameSituation(player) {
  const tg = getTargetGoal(player);
  const ownGoal = getOwnGoal(player);

  return {
    // スコア状況
    scoreDifferential: player.team === "PlayerTeam" ?
      (scorePlayer - scoreDefender) : (scoreDefender - scorePlayer),
    timeRemaining: gameTime,
    quarterContext: quarter,

    // ポゼッション状況
    shotClockUrgency: shotClock / 24,
    teamPossession: possession === player.team,

    // コート位置
    distanceToBasket: dist(player.x, player.y, tg.x, tg.y),
    distanceToOwnBasket: dist(player.x, player.y, ownGoal.x, ownGoal.y),

    // ディフェンスプレッシャー
    nearestDefender: findNearestDefender(player),
    pressureLevel: calculatePressureLevel(player),

    // チーム状態
    openTeammates: findOpenTeammates(player),
    teamSpacing: evaluateTeamSpacing(player)
  };
}

// 最も近いディフェンダーを見つける
function findNearestDefender(player) {
  const defenders = players.filter(p => p.team !== player.team);
  if (defenders.length === 0) return null;

  let nearest = defenders[0];
  let minDist = dist(player.x, player.y, nearest.x, nearest.y);

  for (let i = 1; i < defenders.length; i++) {
    let d = dist(player.x, player.y, defenders[i].x, defenders[i].y);
    if (d < minDist) {
      minDist = d;
      nearest = defenders[i];
    }
  }

  return { player: nearest, distance: minDist };
}

// ディフェンスプレッシャーを計算（0-100）
function calculatePressureLevel(player) {
  const nearDef = findNearestDefender(player);
  if (!nearDef) return 0;

  // 距離に基づくプレッシャー（近いほど高い）
  let distPressure = map(nearDef.distance, 0, 100, 100, 0);
  distPressure = constrain(distPressure, 0, 100);

  // ディフェンダーのマーキング能力を考慮
  let defSkill = nearDef.player.marking || 50;
  let skillMultiplier = map(defSkill, 0, 100, 0.7, 1.3);

  return constrain(distPressure * skillMultiplier, 0, 100);
}

// オープンなチームメイトを見つける
function findOpenTeammates(player) {
  const teammates = players.filter(p =>
    p.team === player.team &&
    p.id !== player.id &&
    !p.isJumping
  );

  return teammates.filter(tm => {
    const tmDef = findNearestDefender(tm);
    return !tmDef || tmDef.distance > 60; // 60ユニット以上離れていればオープン
  }).map(tm => ({
    player: tm,
    distance: dist(player.x, player.y, tm.x, tm.y),
    openness: tmDef ? tmDef.distance : 100
  }));
}

// チームスペーシングを評価
function evaluateTeamSpacing(player) {
  const teammates = players.filter(p =>
    p.team === player.team && p.id !== player.id
  );

  let minDistance = 999;
  teammates.forEach(tm => {
    let d = dist(player.x, player.y, tm.x, tm.y);
    if (d < minDistance) minDistance = d;
  });

  return {
    nearestTeammateDistance: minDistance,
    isTooClose: minDistance < AI_CONFIG.spacingMinDistance
  };
}

// バスケットボールIQに基づいた意思決定
function makeBasketballDecision(player, options, situation) {
  if (!options || options.length === 0) return null;

  // オプションをプレイヤーのメンタルステータスで重み付け
  let scoredOptions = options.map(option => {
    let score = option.baseValue || 50;

    // ビジョンが必要なオプション（パス、カットなど）
    if (option.requiresVision) {
      score *= map(player.vision, 0, 100, 0.5, 1.5);
    }

    // 判断力の影響
    let decisionQuality = map(player.decisions, 0, 100, 0.6, 1.4);
    score *= decisionQuality;

    // 予測力が必要なオプション
    if (option.requiresAnticipation) {
      score *= map(player.anticipation, 0, 100, 0.7, 1.3);
    }

    // チームワークがパスに影響
    if (option.type === 'pass') {
      score *= map(player.teamwork, 0, 100, 0.8, 1.2);
    }

    // アグレッションがシュートに影響
    if (option.type === 'shoot') {
      score *= map(player.aggression, 0, 100, 0.7, 1.3);
    }

    // ランダム性を追加（完璧な判断を避ける）
    score *= random(1 - AI_CONFIG.decisionRandomness, 1 + AI_CONFIG.decisionRandomness);

    return { ...option, finalScore: score };
  });

  // スコアでソート
  scoredOptions.sort((a, b) => b.finalScore - a.finalScore);

  // 最適なオプションを選択（一貫性に基づき候補を絞る）
  let consistencyFactor = (player.decisions + player.positioning) / 200;
  let candidateCount = 1 + Math.floor(map(consistencyFactor, 0, 1, 3, 0));
  let candidatePool = scoredOptions.slice(0, candidateCount);

  return random(candidatePool);
}

// シュート品質を評価
function evaluateShotQuality(shooter, distanceToBasket, situation) {
  let quality = 100;

  // ポジション別の有効射程
  let effectiveRange;
  switch(shooter.position) {
    case "C": effectiveRange = 120; break;
    case "PF": effectiveRange = 180; break;
    case "SG": effectiveRange = 280; break;
    case "SF": effectiveRange = 240; break;
    default: effectiveRange = 220;
  }

  // 射程外ペナルティ（緩和）
  if (distanceToBasket > effectiveRange) {
    quality -= (distanceToBasket - effectiveRange) * 0.3; // 0.5 → 0.3
  }

  // ディフェンスコンテスト（大幅緩和）
  let contest = situation.pressureLevel;
  let contestImpact = map(shooter.sht, 0, 100, 25, 10); // 50,20 → 25,10（半減）
  quality -= contest * contestImpact / 100;

  // ショットクロックプレッシャー（削除 - 後で別処理）
  // if (situation.shotClockUrgency < 0.2) {
  //   quality -= 30;
  // }

  // オープンシュートボーナス（増加）
  if (contest < 30) {
    quality += 35; // 25 → 35
  }

  // 近距離ボーナス追加
  if (distanceToBasket < effectiveRange * 0.7) {
    quality += 20;
  }

  // スタミナの影響（緩和）
  let fatigue = shooter.stamina / shooter.maxStamina;
  quality *= map(fatigue, 0.3, 1.0, 0.85, 1.0); // 0.5,1.0,0.8,1.0 → 0.3,1.0,0.85,1.0

  return constrain(quality, 0, 100);
}

// パスオプションを評価
function evaluatePassOptions(passer, situation) {
  const openTeammates = situation.openTeammates;
  if (!openTeammates || openTeammates.length === 0) return [];

  return openTeammates.map(tm => {
    let value = 50;

    // オープン度を評価
    value += tm.openness * 0.3;

    // 距離（近すぎず遠すぎない方が良い）
    let idealDistance = 150;
    let distancePenalty = abs(tm.distance - idealDistance) * 0.1;
    value -= distancePenalty;

    // ターゲットゴールに近いほど価値が高い
    const tg = getTargetGoal(passer);
    let targetDistance = dist(tm.player.x, tm.player.y, tg.x, tg.y);
    value += map(targetDistance, 0, 500, 50, 0);

    // シューターへのパスは価値が高い
    if (tm.player.position === "SG" && targetDistance > 180 && targetDistance < 250) {
      value += 20;
    }

    // ポストプレイヤーへのエントリーパス
    if ((tm.player.position === "C" || tm.player.position === "PF") && targetDistance < 120) {
      value += 15;
    }

    return {
      type: 'pass',
      target: tm.player,
      baseValue: value,
      requiresVision: true,
      isSafe: isPassSafe(passer, tm.player)
    };
  }).filter(opt => opt.isSafe); // 安全なパスのみ
}

// === ディフェンスAI機能 ===

// オンボールディフェンス：ボールハンドラーに対する守備
function calculateOnBallDefense(defender, ballHandler) {
  const basket = getOwnGoal(defender);

  // ゴールとボールの間に位置する
  let defenseAngle = atan2(basket.y - ballHandler.y, basket.x - ballHandler.x);

  // ディフェンス距離（マーキング能力で調整）
  let optimalDistance = map(defender.marking, 0, 100, 45, 25);

  // シュート脅威が高い場合は密着
  let shootingThreat = ballHandler.position === "SG" ? ballHandler.tpt : ballHandler.sht;
  if (shootingThreat > 75) {
    optimalDistance *= 0.7; // より密着
  } else if (shootingThreat < 50) {
    optimalDistance *= 1.3; // 少し離れる
  }

  // 目標位置
  let targetX = ballHandler.x + cos(defenseAngle) * optimalDistance;
  let targetY = ballHandler.y + sin(defenseAngle) * optimalDistance;

  // ゴールに近い場合はより積極的に
  let distToGoal = dist(ballHandler.x, ballHandler.y, basket.x, basket.y);
  let intensity = map(distToGoal, 0, 200, 1.5, 0.8);
  intensity = constrain(intensity, 0.8, 1.5);

  return {
    targetX: targetX,
    targetY: targetY,
    intensity: intensity,
    shouldContest: distToGoal < 250 // コンテスト範囲
  };
}

// ヘルプディフェンスの必要性を判定
function shouldProvideHelpDefense(defender, ballHandler, team) {
  const basket = getOwnGoal(defender);
  const ballDist = dist(ballHandler.x, ballHandler.y, basket.x, basket.y);

  // ペイントエリアに侵入している場合はヘルプが必要
  if (ballDist < 150) {
    // プライマリーディフェンダーが抜かれているか確認
    let primaryDefender = players.find(p =>
      p.team === team &&
      p.id % 5 === ballHandler.id % 5
    );

    if (primaryDefender) {
      let primaryDist = dist(primaryDefender.x, primaryDefender.y, ballHandler.x, ballHandler.y);
      if (primaryDist > 60) {
        // 抜かれている！ヘルプが必要
        let helpDist = dist(defender.x, defender.y, ballHandler.x, ballHandler.y);
        return {
          needed: true,
          urgency: map(ballDist, 0, 150, 100, 30),
          helpDistance: helpDist
        };
      }
    }
  }

  return { needed: false, urgency: 0 };
}

// ヘルプポジションを計算
function calculateHelpPosition(defender, ballHandler, basket) {
  // ボールとゴールの間に位置
  let helpX = (ballHandler.x + basket.x * 2) / 3;
  let helpY = (ballHandler.y + basket.y * 2) / 3;

  // ポジショニング能力で調整
  let positionQuality = map(defender.positioning, 0, 100, 0.6, 1.0);
  helpX = ballHandler.x + (helpX - ballHandler.x) * positionQuality;
  helpY = ballHandler.y + (helpY - ballHandler.y) * positionQuality;

  return { x: helpX, y: helpY };
}

// クローズアウト実行
function executeCloseout(defender, shooter) {
  let distToShooter = dist(defender.x, defender.y, shooter.x, shooter.y);

  if (distToShooter > 50) {
    // 距離がある場合はスプリント
    defender.isClosingOut = true;
    defender.speedMultiplier = SPEED_SPRINT;

    // クローズアウトパス（シューターのストロングサイドをやや塞ぐ）
    let closeoutAngle = atan2(shooter.y - defender.y, shooter.x - defender.x);
    let strongSideAdjust = shooter.position === "SG" ? 0.1 : -0.05;
    closeoutAngle += strongSideAdjust;

    let targetX = shooter.x - cos(closeoutAngle) * 35;
    let targetY = shooter.y - sin(closeoutAngle) * 35;

    return { targetX, targetY, shouldSprint: true };
  } else {
    // 至近距離では制御されたアプローチ
    defender.isClosingOut = false;
    defender.speedMultiplier = SPEED_WALK;

    let targetX = shooter.x - (shooter.x - defender.x) * 0.3;
    let targetY = shooter.y - (shooter.y - defender.y) * 0.3;

    return { targetX, targetY, shouldSprint: false };
  }
}

// === オフェンスコーディネーション機能 ===

// カッティングチャンスを評価
function shouldCut(player, ballHandler) {
  if (!ballHandler) return false;

  const tg = getTargetGoal(player);
  const distToGoal = dist(player.x, player.y, tg.x, tg.y);

  // ゴールから遠すぎる場合はカットしない
  if (distToGoal > 300) return false;

  // ディフェンダーが見失っているか確認
  const myDefender = findMyDefender(player);
  if (!myDefender) return true; // ディフェンダーがいない = カット可能

  const defDist = dist(player.x, player.y, myDefender.x, myDefender.y);

  // ディフェンダーが離れている、またはボールに気を取られている
  if (defDist > 70) return true;

  // ディフェンダーがボールハンドラーを見ている（ヘルプに傾いている）
  const defDistToBall = dist(myDefender.x, myDefender.y, ballHandler.x, ballHandler.y);
  const meDistToBall = dist(player.x, player.y, ballHandler.x, ballHandler.y);

  if (defDistToBall < meDistToBall) {
    // ディフェンダーがボールに寄っている = バックドアチャンス
    return player.anticipation > 60; // 予測力が高い選手だけが認識
  }

  return false;
}

// 自分のディフェンダーを見つける
function findMyDefender(player) {
  const defenders = players.filter(p => p.team !== player.team);

  let nearestDef = null;
  let minDist = 999;

  for (let def of defenders) {
    let d = dist(player.x, player.y, def.x, def.y);
    if (d < minDist) {
      minDist = d;
      nearestDef = def;
    }
  }

  return nearestDef;
}

// スペーシングポジションを計算
function calculateSpacingPosition(player, ballHandler, teammates) {
  const tg = getTargetGoal(player);
  const pos = player.position;

  let targetX, targetY;

  // ポジション別の理想位置
  if (pos === "SG" || pos === "SF") {
    // ウイング・コーナー（3Pライン周辺）
    const side = player.id % 2 === 0 ? -1 : 1;
    targetX = tg.x + (player.team === "PlayerTeam" ? -180 : 180);
    targetY = tg.y + side * 120;
  } else if (pos === "PF") {
    // ハイポストまたはコーナー
    const ballSide = ballHandler.y > tg.y ? 1 : -1;
    targetX = tg.x + (player.team === "PlayerTeam" ? -100 : 100);
    targetY = tg.y + ballSide * 80;
  } else if (pos === "C") {
    // ローポストまたはダンカースポット
    targetX = tg.x + (player.team === "PlayerTeam" ? -60 : 60);
    targetY = tg.y;
  } else { // PG
    // トップオブキー
    targetX = tg.x + (player.team === "PlayerTeam" ? -220 : 220);
    targetY = tg.y;
  }

  // チームメイトとの距離が近すぎる場合は調整
  for (let tm of teammates) {
    if (tm.id === player.id) continue;
    let tmDist = dist(targetX, targetY, tm.x, tm.y);
    if (tmDist < AI_CONFIG.spacingMinDistance) {
      // 離れる方向に調整
      let awayAngle = atan2(targetY - tm.y, targetX - tm.x);
      targetX += cos(awayAngle) * 30;
      targetY += sin(awayAngle) * 30;
    }
  }

  // コート内に収める
  targetX = constrain(targetX, 125, 875);
  targetY = constrain(targetY, 275, 537.5);

  return { x: targetX, y: targetY };
}

// スクリーン設定のチャンスを評価
function shouldSetScreen(player, ballHandler) {
  if (!ballHandler) return false;
  if (player.position === "PG" || player.position === "SG") return false; // ガードはスクリーンしない

  // ボールハンドラーがPGまたはSGで、距離が適切
  if ((ballHandler.position === "PG" || ballHandler.position === "SG")) {
    let distToBall = dist(player.x, player.y, ballHandler.x, ballHandler.y);
    if (distToBall > 100 && distToBall < 200) {
      return random() < 0.05; // 5%の確率でスクリーン
    }
  }

  return false;
}

// ポストアップポジションを評価
function shouldPostUp(player) {
  if (player.position !== "C" && player.position !== "PF") return false;

  const tg = getTargetGoal(player);
  const distToGoal = dist(player.x, player.y, tg.x, tg.y);

  // ゴール近くにいる場合のみポストアップ
  if (distToGoal < 120) {
    const myDef = findMyDefender(player);
    if (!myDef) return true;

    // ディフェンダーとの位置関係
    const defDist = dist(player.x, player.y, myDef.x, myDef.y);
    if (defDist < 50) {
      // ディフェンダーを背負える位置
      const toGoalAngle = atan2(tg.y - player.y, tg.x - player.x);
      const toDefAngle = atan2(myDef.y - player.y, myDef.x - player.x);
      const angleDiff = abs(toGoalAngle - toDefAngle);

      // ディフェンダーがゴール側にいる = シールできる
      return angleDiff < PI / 2;
    }
  }

  return false;
}

function updatePlayerAI(p) {
  // ゴール後の守備帰陣：素早く自陣に戻る
  if(p.returningToDefense) {
    p.speedMultiplier = SPEED_SPRINT;
    let pos = p.position;
    let idealX, idealY;
    // PlayerTeam（青）は左ゴール（x=138付近）を守る
    // DefenderTeam（赤）は右ゴール（x=861付近）を守る
    if(pos === "PG" || pos === "SG") {
      idealX = p.team === "PlayerTeam" ? 250 : 750; // 守るゴール近く
      idealY = pos === "PG" ? 350 : 420;
    } else if(pos === "SF") {
      idealX = p.team === "PlayerTeam" ? 300 : 700;
      idealY = 388.75;
    } else {
      idealX = p.team === "PlayerTeam" ? 200 : 800; // ペイント付近
      idealY = pos === "PF" ? 340 : 430;
    }
    moveToward(p, idealX, idealY, p.spd * 0.045 * p.speedMultiplier);

    // 位置についたら完了
    if(dist(p.x, p.y, idealX, idealY) < 20) {
      p.returningToDefense = false;
    }
    return;
  }

  // スローイン時：スロワーは指定位置へ、パスを出す（5秒以内必須）
  if(throwInState && throwInState.thrower === p.id) {
  // OPUS FIX: Timeout for stuck throw-ins
  if(frameCount - throwInState.startTime > 600) { // 10 seconds
    console.warn("Throw-in timeout - forcing completion");
    throwInState = null;
    p.hasBall = true;
    ball.x = p.x; ball.y = p.y; ball.z = 45;
    return;
  }
    p.speedMultiplier = SPEED_JOG;
    p.hasBall = false; // スローイン中はドリブル禁止（バイオレーション防止）
    // フェーズ1: ボールを拾いに行く
    if(throwInState.phase === "fetching") {
      moveToward(p, throwInState.ballX, throwInState.ballY, p.spd * 0.08);
      // ボールを選手と一緒に移動
      // Ball follows player (even out of bounds)
      ball.x = p.x; ball.y = p.y; ball.z = 45;
      // ボールに到達したらフェーズ2へ
      if(dist(p.x, p.y, throwInState.ballX, throwInState.ballY) < 30) {
        throwInState.phase = "positioning";
        addFloatingText(p.x, p.y - 40, "BALL FETCHED", [100, 255, 100]);
      }
      return;
    }
    // フェーズ2: スローイン位置へ移動
    if(throwInState.phase === "positioning") {
      moveToward(p, throwInState.x, throwInState.y, p.spd * 0.06);
      // ボールを選手と一緒に移動
      ball.x = p.x; ball.y = p.y; ball.z = 45;
      // スローイン位置に到達したらフェーズ3へ
      if(dist(p.x, p.y, throwInState.x, throwInState.y) < 20) {
        throwInState.phase = "ready";
      }
      return;
    }
    // フェーズ3: スローイン実行
    if(throwInState.phase === "ready") {
      // タイマー初期化
      if(!throwInState.timer) throwInState.timer = 0;
      throwInState.timer++;
      // 5秒ルール（300フレーム = 5秒）
      if(throwInState.timer > 300) {
        // 5秒バイオレーション：相手ボールに
        let newTeam = throwInState.team === "PlayerTeam" ? "DefenderTeam" : "PlayerTeam";
        addFloatingText(throwInState.x, throwInState.y - 40, "5-SEC VIOLATION!", [255, 100, 100]);
        startThrowIn(newTeam, throwInState.x, throwInState.y, "5-SEC VIOLATION");
        return;
      }
      // 近くの味方にパスを出す（即座に判定）
      let teammates = players.filter(t => t.team === p.team && t.id !== p.id);
      // オープンな味方を優先
      let openTeammates = teammates.filter(t => {
        let nearDef = players.filter(d => d.team !== p.team && dist(d.x, d.y, t.x, t.y) < 50);
        return nearDef.length === 0;
      });
      let target = openTeammates.length > 0 ? 
        openTeammates.sort((a,b) => dist(p.x,p.y,a.x,a.y) - dist(p.x,p.y,b.x,b.y))[0] :
        teammates.sort((a,b) => dist(p.x,p.y,a.x,a.y) - dist(p.x,p.y,b.x,b.y))[0];
      if(target && dist(p.x, p.y, target.x, target.y) < 250 && throwInState.timer > 90) {
        if(isPassSafe(p, target)) {
          // スローイン専用のパス処理
          let d = dist(p.x, p.y, target.x, target.y);
          let spd = 7, t = d / spd;
          ball.x = p.x; ball.y = p.y; ball.z = 45;
          ball.vx = (target.x - ball.x) / t;
          ball.vy = (target.y - ball.y) / t;
          ball.vz = 2.5;
          ball.passTarget = target.id;
          ball.lastTouch = p.team;
          throwInState = null; // スローイン完了
          return;
        }
      } else if(throwInState.timer > 180) {
        // 3秒経過：強制的にスローイン（安全性無視）
        if(target && dist(p.x, p.y, target.x, target.y) < 300) {
          let d = dist(p.x, p.y, target.x, target.y);
          let spd = 7, t = d / spd;
          ball.x = p.x; ball.y = p.y; ball.z = 45;
          ball.vx = (target.x - ball.x) / t;
          ball.vy = (target.y - ball.y) / t;
          ball.vz = 2.5;
          ball.passTarget = target.id;
          ball.lastTouch = p.team;
          throwInState = null;
          return;
        }
      }
    }
    return;
  }
  if(throwInState && p.team === throwInState.team && p.id !== throwInState.thrower) {
    p.speedMultiplier = SPEED_WALK; // 受け取る位置への微調整は歩き
    let thrower = players.find(pl => pl.id === throwInState.thrower);
    if(thrower) {
      let currentDist = dist(p.x, p.y, thrower.x, thrower.y);
      // スロワーから遠すぎる場合は直接近づく
      if(currentDist > 250) {
        p.speedMultiplier = SPEED_JOG;
        moveToward(p, thrower.x, thrower.y, p.spd * 0.05);
      } else {
        // 適度な距離に配置
        let ang = atan2(p.y - thrower.y, p.x - thrower.x);
        let targetDist = 120 + (p.id % 3) * 20;
        let tx = thrower.x + cos(ang) * targetDist;
        let ty = thrower.y + sin(ang) * targetDist;
        moveToward(p, constrain(tx, 125, 875), constrain(ty, 275, 537.5), p.spd * 0.04);
      }
    }
    return;
  }
  // スローイン中：ディフェンス側は自陣へ戻る
  if(throwInState && p.team !== throwInState.team) {
    let halfCourt = 500;
    let isInOpponentHalf = (p.team === "PlayerTeam" && p.x > halfCourt) ||
                            (p.team === "DefenderTeam" && p.x < halfCourt);
    if(isInOpponentHalf) {
      p.speedMultiplier = SPEED_JOG;
      p.state = "transition_defense";
      let backX = (p.team === "PlayerTeam" ? 350 : 650);
      let backY = 388.75 + (p.id % 3 - 1) * 50;
      moveToward(p, backX, backY, p.spd * 0.04);
      return;
    }
  }
  if(p.lock > 0) { p.lock--; }
  let isOffense = p.team === possession;
  // トランジションディフェンス：相手ボールになったら即座に自陣へ戻る
  if(!isOffense && !p.hasBall) {
    let ballHandler = players.find(pl => pl.hasBall);
    if(ballHandler && ballHandler.team !== p.team) {
      // 自陣のハーフコートより前にいる場合は戻る
      let halfCourt = 500;
      let isInOpponentHalf = (p.team === "PlayerTeam" && p.x > halfCourt) || 
                              (p.team === "DefenderTeam" && p.x < halfCourt);
      if(isInOpponentHalf) {
        // 速やかに自陣へ戻る
        p.speedMultiplier = SPEED_SPRINT;
        p.state = "transition_defense";
        let backX = (p.team === "PlayerTeam" ? 350 : 650);
        let backY = 388.75 + (p.id % 3 - 1) * 50;
        let transSpeed = p.spd * 0.045 * (p.stamina/p.maxStamina * 0.4 + 0.6) * SPEED_SPRINT;
        moveToward(p, backX, backY, transSpeed);
        // 自陣に戻ったら通常ディフェンスへ
        if((p.team === "PlayerTeam" && p.x < halfCourt + 20) ||
           (p.team === "DefenderTeam" && p.x > halfCourt - 20)) {
          // 戻り完了、通常ディフェンスへ
        } else {
          return; // 戻り中は他の行動をしない
        }
      }
    }
  }
  let tg = p.team === "PlayerTeam" ? {x:finalGoal.ringX,y:finalGoal.ringY} : {x:1000-finalGoal.ringX,y:finalGoal.ringY};
  let og = p.team === "PlayerTeam" ? {x:1000-finalGoal.ringX,y:finalGoal.ringY} : {x:finalGoal.ringX,y:finalGoal.ringY};
  let baseSpeed = p.spd * 0.03645 * (p.stamina/p.maxStamina * 0.4 + 0.6);
  let speed = baseSpeed * p.speedMultiplier;

  if(p.hasBall && p.lock <= 0) {
    p.state = "offense";

    // 新しいAI意思決定システム：ゲーム状況を評価
    let situation = evaluateGameSituation(p);
    let dToGoal = situation.distanceToBasket;

    let nearDefenders = players.filter(d => d.team !== p.team && dist(d.x,d.y,p.x,p.y) < 40);
    let dominated = nearDefenders.length >= 2;
    let pressured = nearDefenders.length >= 1;
    let teammates = players.filter(t => t.team===p.team && t.id!==p.id);

    // OPUS FIX: Pressure escape system
    let closestDef = nearDefenders[0];
    let heavyPressure = closestDef && dist(p.x, p.y, closestDef.x, closestDef.y) < 35;

    if(heavyPressure && !p.pressureEscaping) {
      // Option 1: Find safe pass (preferred)
      let safeTeammates = teammates.filter(t => {
        let defDist = dist(t.x, t.y, closestDef.x, closestDef.y);
        return defDist > 80 && isPassSafe(p, t);
      });

      if(safeTeammates.length > 0 && random() < 0.7) {
        // Emergency pass to open teammate
        let target = safeTeammates.sort((a,b) =>
          dist(b.x, b.y, closestDef.x, closestDef.y) - dist(a.x, a.y, closestDef.x, closestDef.y))[0];
        passTo(p, target);
        addFloatingText(p.x, p.y - 30, "ESCAPE PASS", [100, 255, 255]);
        return;
      } else {
        // Option 2: Dribble escape (no safe pass)
        p.pressureEscaping = true;
        p.escapeTimer = 30; // 0.5 seconds

        // Calculate escape direction (away from defender)
        let escapeAngle = atan2(p.y - closestDef.y, p.x - closestDef.x);
        let escapeX = p.x + cos(escapeAngle) * 100;
        let escapeY = p.y + sin(escapeAngle) * 100;
        p.escapeTarget = {x: constrain(escapeX, 50, 950), y: constrain(escapeY, 270, 540)};
        addFloatingText(p.x, p.y - 30, "DRIBBLE ESCAPE", [255, 255, 100]);
      }
    }

    // Execute dribble escape
    if(p.pressureEscaping && p.escapeTimer > 0) {
      p.escapeTimer--;
      p.speedMultiplier = SPEED_SPRINT; // Fast escape
      moveToward(p, p.escapeTarget.x, p.escapeTarget.y, speed);
      if(p.escapeTimer <= 0 || dist(p.x, p.y, p.escapeTarget.x, p.escapeTarget.y) < 20) {
        p.pressureEscaping = false;
      }
      return;
    }

    // 速攻判断
    let forwardRange = 200;
    let enemiesForward = players.filter(d => {
      if(d.team === p.team) return false;
      let toEnemy = p.team === "PlayerTeam" ? d.x > p.x : d.x < p.x;
      return toEnemy && dist(p.x, p.y, d.x, d.y) < forwardRange;
    }).length;
    let alliesForward = teammates.filter(t => {
      let toGoal = p.team === "PlayerTeam" ? t.x > p.x : t.x < p.x;
      return toGoal && dist(p.x, p.y, t.x, t.y) < forwardRange;
    }).length;
    let outnumbered = enemiesForward - alliesForward >= 2;
    let fastBreak = alliesForward > enemiesForward && dToGoal > 200; // 速攻チャンス

    // パス判断（新AI：状況認識に基づく）- 大幅に削減
    let passBaseRate = map(p.vision, 0, 100, 0.001, 0.006); // 0.003,0.012 → 0.001,0.006（半減）
    let passDecisionQuality = map(p.decisions, 0, 100, 0.7, 1.2); // 0.6,1.4 → 0.7,1.2
    passBaseRate *= passDecisionQuality;
    if(p.position === "PG") passBaseRate *= 1.2; // 1.3 → 1.2
    if(pressured) passBaseRate *= 1.3; // 1.5 → 1.3

    // ゴール近くではパスを減らす
    if(dToGoal < 120) passBaseRate *= 0.3;

    // 新しいパス評価システムを使用
    let passOptions = evaluatePassOptions(p, situation);
    let bestPass = null, bestScore = -999;

    if(passOptions.length > 0) {
      // パスオプションを評価してベストを選択
      for(let opt of passOptions) {
        if(opt.baseValue > bestScore) {
          bestScore = opt.baseValue;
          bestPass = opt.target;
        }
      }
    }

    // ①ダブルチーム時：パス必須（最優先）
    if(dominated) {
      let cuttingMate = teammates.find(t => t.isCutting && dist(p.x, p.y, t.x, t.y) < 250);
      if(cuttingMate && isPassSafe(p, cuttingMate)) { passTo(p, cuttingMate); return; }
      if(bestPass && isPassSafe(p, bestPass)) { passTo(p, bestPass); return; }
      let nearest = teammates.sort((a,b) => dist(p.x,p.y,a.x,a.y) - dist(p.x,p.y,b.x,b.y))[0];
      if(nearest && isPassSafe(p, nearest)) { passTo(p, nearest); return; }
    }

    // ②シュート判断（新AI：状況認識に基づく）
    // シュート品質を評価
    let shotQuality = evaluateShotQuality(p, dToGoal, situation);

    // ポジション別の射程と傾向（ベース確率を大幅UP）
    let shootDist = 170, baseShootChance = 0.25; // 0.15 → 0.25
    if(p.position === "SG") { shootDist = 240; baseShootChance = 0.35; } // 0.22 → 0.35
    else if(p.position === "SF") { shootDist = 210; baseShootChance = 0.28; } // 0.18 → 0.28
    else if(p.position === "C" || p.position === "PF") { shootDist = 150; baseShootChance = 0.40; } // 0.25 → 0.40
    else if(p.position === "PG") { shootDist = 220; baseShootChance = 0.22; } // 0.14 → 0.22

    // シュート品質に基づいて確率を調整（係数も緩和）
    let shootChance = baseShootChance * map(shotQuality, 0, 100, 0.5, 2.0); // 0.3,2.5 → 0.5,2.0

    // ショットクロック緊急時は強制シュート
    if(shotClock < 5 && dToGoal < 300) {
      shootChance = 0.98; // ほぼ確実
      shootDist = 300;
    } else if(shotClock < 8 && dToGoal < shootDist * 1.2) {
      shootChance *= 2.2; // 1.8 → 2.2
    }

    // 高品質シュート（オープン＆近距離）は積極的に
    if(shotQuality > 65 && dToGoal < shootDist * 0.8) { // 70 → 65
      shootChance *= 3.0; // 2.5 → 3.0
    }

    // 近距離なら品質に関わらず積極的
    if(!pressured && dToGoal < shootDist * 0.6) {
      shootChance *= 2.5;
    }

    // 意思決定能力が高いほど良いタイミングでシュート（影響度軽減）
    shootChance *= map(p.decisions, 0, 100, 0.85, 1.15); // 0.7,1.3 → 0.85,1.15

    if(dToGoal < shootDist && random() < shootChance && !p.isJumping) {
      p.isJumping = true; p.mustShoot = true;
      p.vz = sqrt(2 * map(p.jmp,0,100,50,100) * (BALL_GRAVITY * 0.5));
      return;
    }

    // ③速攻：前方のフリーな味方にロングパス
    if(fastBreak) {
      p.speedMultiplier = SPEED_SPRINT;
      let fwdMate = teammates.find(t => {
        let isAhead = p.team === "PlayerTeam" ? t.x > p.x + 80 : t.x < p.x - 80;
        return isAhead && dist(t.x,t.y,tg.x,tg.y) < 200;
      });
      if(fwdMate && isPassSafe(p, fwdMate)) { passTo(p, fwdMate); return; }
      moveToward(p, tg.x, tg.y, speed * SPEED_SPRINT);
      return;
    }

    // ④ピック&ロール開始（PG/SG主導）
    if((p.position === "PG" || p.position === "SG") && random() < 0.30 && dToGoal < 250 && !dominated) {
      initiateScreen(p);
    }

    // ⑤通常パス（極めて低頻度：本当に良い機会のみ）
    let cuttingMate = teammates.find(t => t.isCutting && dist(p.x, p.y, t.x, t.y) < 250);
    if(cuttingMate && random() < passBaseRate * 1.2 && dToGoal > 100) { // 1.5 → 1.2、ゴール近くでは無視
      if(isPassSafe(p, cuttingMate)) { passTo(p, cuttingMate); return; }
    }
    // ベストパスは明らかに良い場合のみ
    if(bestPass && random() < passBaseRate * 0.8 && bestScore > 70) { // 係数1.0→0.8、スコア50→70
      if(bestPass && isPassSafe(p, bestPass)) { passTo(p, bestPass); return; }
    }
    // PG戻しは削除（パス過多の原因）
    // if(p.position !== "PG" && dToGoal > 150) {
    //   let pgMate = teammates.find(t => t.position === "PG" && dist(p.x, p.y, t.x, t.y) < 250);
    //   if(pgMate && pressured && random() < passBaseRate) {
    //     if(pgMate && isPassSafe(p, pgMate)) { passTo(p, pgMate); return; }
    //   }
    // }

    // ⑥数的不利時：無理せず展開
    if(outnumbered && dToGoal > 150) {
      p.speedMultiplier = SPEED_JOG;
      if(bestPass && isPassSafe(p, bestPass)) { passTo(p, bestPass); return; }
      let waitX = p.team === "PlayerTeam" ? p.x - 15 : p.x + 15;
      moveToward(p, waitX, p.y, speed * 0.4);
      return;
    }

    // ⑦ドライブ（ディフェンダー回避しながらゴールへ）
