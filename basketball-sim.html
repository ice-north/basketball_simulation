<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<style>
* { box-sizing: border-box; }
body { margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; background: #1a1a2e; font-family: 'Segoe UI', sans-serif; padding: 10px; }
#container { display: flex; flex-direction: column; align-items: center; gap: 8px; }
#stats { display: flex; gap: 15px; color: #fff; font-size: 11px; }
.stat-box { background: rgba(255,255,255,0.1); padding: 6px 10px; border-radius: 6px; }
#roster { display: flex; gap: 20px; margin-top: 8px; width: 1000px; max-height: 600px; overflow-y: auto; }
.team-roster { flex: 1; background: rgba(255,255,255,0.05); border-radius: 8px; padding: 8px; }
.team-roster h3 { margin: 0 0 8px 0; font-size: 12px; text-align: center; }
.team-roster.blue h3 { color: #0af; }
.team-roster.red h3 { color: #f55; }
.player-row { margin-bottom: 8px; font-size: 10px; color: #fff; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 6px; }
.player-row .pos-label { font-weight: bold; margin-bottom: 4px; font-size: 11px; }
.stat-category { font-size: 8px; color: #888; margin-top: 4px; margin-bottom: 2px; }
.stat-line { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 2px; }
.stat-item { display: flex; align-items: center; gap: 2px; }
.stat-label { font-size: 7px; color: #aaa; min-width: 20px; text-align: right; }
.stat-item input { width: 32px; padding: 2px; border: none; border-radius: 3px; background: rgba(255,255,255,0.15); color: #fff; text-align: center; font-size: 8px; }
.stat-item input:focus { outline: 1px solid #0af; background: rgba(255,255,255,0.25); }
.speed-btn { padding: 4px 8px; margin: 0 2px; border: 1px solid rgba(255,255,255,0.3); border-radius: 4px; background: rgba(255,255,255,0.1); color: #fff; font-size: 10px; cursor: pointer; transition: all 0.2s; }
.speed-btn:hover { background: rgba(255,255,255,0.2); }
.speed-btn.active { background: #0af; border-color: #0af; font-weight: bold; }
</style>
</head><body>
<div id="container">
<div id="stats">
<div class="stat-box" id="gameInfo">Q1 12:00</div>
<div class="stat-box" id="shotClock">SHOT: 24</div>
<div class="stat-box" id="possession">POSS: --</div>
<div class="stat-box">
<span style="margin-right: 8px;">SPEED:</span>
<button class="speed-btn active" onclick="setGameSpeed(1)">1x</button>
<button class="speed-btn" onclick="setGameSpeed(2)">2x</button>
<button class="speed-btn" onclick="setGameSpeed(4)">4x</button>
<button class="speed-btn" onclick="setGameSpeed(8)">8x</button>
</div>
</div>
<div id="game"></div>
<div id="roster">
<div class="team-roster blue"><h3>BLUE TEAM</h3><div id="blueRoster"></div></div>
<div class="team-roster red"><h3>RED TEAM</h3><div id="redRoster"></div></div>
</div>
</div>
<script>
const court = {tl:{x:175,y:250},tr:{x:825,y:250},br:{x:987.5,y:562.5},bl:{x:12.5,y:562.5}};
const cCircle = {centerCircleW:150,centerCircleH:72.5,centerCircleY:388.75};
const p7 = [{x:833.75,y:268.75},{x:740,y:278.75},{x:666.25,y:316.25},{x:642.5,y:392.5},{x:708.75,y:478.75},{x:825,y:521.25},{x:970,y:532.5}];
const paintData = {paintPoints:[{x:872.5,y:342.5},{x:912.5,y:420},{x:718.75,y:411.25},{x:708.75,y:356.25}],ftCircle:{x:715,y:383.75,w:112.5,h:53.75}};
let finalGoal = {ringX:861.25,ringY:381.25,ringZ:110,ringSize:25,poleBaseX:895,poleBaseY:345,board:[{x:900,y:346.25},{x:900,y:407.5},{x:868.75,y:370},{x:868.75,y:318.75}]};

let players = [], ball, scorePlayer = 0, scoreDefender = 0, goalChecked = false;
let gameTime = 720, quarter = 1, shotClock = 24, possession = null;
let gameState = "playing", throwInState = null;
let particles = [], floatingTexts = [];
const NET_DAMPING = 0.85, BALL_GRAVITY = 0.45, BOUNCE_FACTOR = 0.72, AIR_RESISTANCE = 0.99;
let netRight = {offsetX:0,swing:0,phase:0}, netLeft = {offsetX:0,swing:0,phase:0};
// クォーターごとのスコア記録 [Q1, Q2, Q3, Q4]
let quarterScoresPlayer = [0, 0, 0, 0];
let quarterScoresDefender = [0, 0, 0, 0];
let lastScorePlayer = 0, lastScoreDefender = 0;
// ジャンプボール状態
let jumpBallState = null;
const positions = ["PG","SG","SF","PF","C"];
const SPEED_WALK = 0.3, SPEED_JOG = 0.6, SPEED_RUN = 1.0, SPEED_SPRINT = 1.5;
// ゲーム速度
let gameSpeed = 1;
// 戦略システム
let screens = []; // {screener: id, ballHandler: id, startTime: frameCount, completed: bool}
let cuts = []; // {cutter: id, type: "backdoor"/"baseline", targetX, targetY, startTime}
let foulState = null; // {shooter: id, foulCount, team, attempts: 2/3}
let teamFouls = {PlayerTeam: 0, DefenderTeam: 0}; // チームファウル数
let playerFouls = {}; // 個人ファウル {playerId: count}

function setup() {
  let c = createCanvas(1000, 750);
  c.parent('game');
  initPlayers();
  ball = {x:500,y:388.75,z:0,vx:0,vy:0,vz:0,trail:[],lastTouch:"PlayerTeam",passTarget:null};
  // ファウルカウント初期化
  for(let p of players) playerFouls[p.id] = 0;
  buildRosterUI();
  startJumpBall(); // ゲーム開始時はジャンプボール
}

function initPlayers() {
  for (let i = 0; i < 10; i++) {
    let team = i < 5 ? "PlayerTeam" : "DefenderTeam";
    let pos = positions[i % 5];
    players[i] = {
      id: i, team, position: pos, number: i < 5 ? (i+1)*10 : (i-4)*10+1,

      // 属性
      height: pos==="C" ? 210 : pos==="PF" ? 205 : pos==="SF" ? 200 : 190,

      // フィジカル
      power: pos==="C"?80:pos==="PF"?75:pos==="SF"?65:60,
      spd: pos==="PG"?90:pos==="SG"?85:pos==="C"?60:75,
      acceleration: pos==="PG"?85:pos==="SG"?80:pos==="C"?50:70,
      jmp: pos==="SF"?75:pos==="SG"?70:60,
      balance: pos==="PG"?75:pos==="C"?80:70,
      agility: pos==="PG"?85:pos==="SG"?80:pos==="C"?50:70,
      stamina: 100,
      maxStamina: 100,
      recovery: pos==="PG"?70:pos==="C"?85:75,

      // テクニカル
      sht: pos==="SG"?85:pos==="PG"?75:65,
      tpt: pos==="SG"?80:pos==="PG"?70:40,
      dribble: pos==="PG"?85:pos==="SG"?75:pos==="C"?40:60,
      pas: pos==="PG"?85:60,
      marking: pos==="PG"?60:pos==="SG"?65:pos==="C"?55:60,
      rebound: pos==="C"?85:pos==="PF"?75:pos==="SF"?60:40,
      stl: pos==="PG"?70:50,
      handling: pos==="PG"?85:pos==="SG"?75:pos==="C"?40:60,

      // メンタル
      workrate: pos==="PG"?80:pos==="C"?60:70,
      vision: pos==="PG"?85:pos==="SG"?70:60,
      teamwork: 70,
      positioning: pos==="C"?80:pos==="PF"?75:pos==="PG"?75:70,
      anticipation: pos==="PG"?75:pos==="SG"?70:65,
      decisions: pos==="PG"?80:pos==="SG"?70:65,
      aggression: pos==="C"?75:pos==="PF"?70:60,
      reactions: pos==="PG"?80:pos==="SG"?75:70,

      // ゲーム用
      blk: pos==="C"?80:pos==="PF"?65:40,
      staminaDecay: 1.0,
      x: team==="PlayerTeam" ? 187.5+i*37.5 : 812.5-((i-5)*37.5), y: 350+((i%5)*43.75), z: 0, vz: 0,
      prevX: team==="PlayerTeam" ? 187.5+i*37.5 : 812.5-((i-5)*37.5),
      prevY: 350+((i%5)*43.75),
      hasBall: false, lock: 0, isJumping: false, size: 25,
      state: "idle", dribblePhase: 0, mustShoot: false,
      speedMultiplier: SPEED_RUN,
      currentSpeed: 0, // 現在の速度（加速用）
      facingAngle: 0, // 向いている方向（ラジアン）
      moveTarget: null, actionQueue: [],
      // 戦略用
      isScreening: false, screenTarget: null, screenTimer: 0,
      isCutting: false, cutTarget: null, cutType: null,
      isBoxingOut: false, boxOutTarget: null,
      helpDefense: false, helpTarget: null
    };
  }
}

function buildRosterUI() {
  let blueDiv = document.getElementById('blueRoster');
  let redDiv = document.getElementById('redRoster');
  players.forEach((p, i) => {
    let container = i < 5 ? blueDiv : redDiv;
    let row = document.createElement('div');
    row.className = 'player-row';
    row.innerHTML = `
      <div class="pos-label">${p.position}</div>
      <div class="stat-category">属性</div>
      <div class="stat-line">
        <div class="stat-item"><span class="stat-label">身長</span><input type="number" min="160" max="230" value="${p.height}" data-id="${i}" data-stat="height"></div>
      </div>
      <div class="stat-category">フィジカル</div>
      <div class="stat-line">
        <div class="stat-item"><span class="stat-label">パワー</span><input type="number" min="1" max="99" value="${p.power}" data-id="${i}" data-stat="power"></div>
        <div class="stat-item"><span class="stat-label">スピード</span><input type="number" min="1" max="99" value="${p.spd}" data-id="${i}" data-stat="spd"></div>
        <div class="stat-item"><span class="stat-label">瞬発力</span><input type="number" min="1" max="99" value="${p.acceleration}" data-id="${i}" data-stat="acceleration"></div>
        <div class="stat-item"><span class="stat-label">ジャンプ</span><input type="number" min="1" max="99" value="${p.jmp}" data-id="${i}" data-stat="jmp"></div>
      </div>
      <div class="stat-line">
        <div class="stat-item"><span class="stat-label">バランス</span><input type="number" min="1" max="99" value="${p.balance}" data-id="${i}" data-stat="balance"></div>
        <div class="stat-item"><span class="stat-label">器用さ</span><input type="number" min="1" max="99" value="${p.agility}" data-id="${i}" data-stat="agility"></div>
        <div class="stat-item"><span class="stat-label">スタミナ</span><input type="number" min="50" max="200" value="${p.maxStamina}" data-id="${i}" data-stat="maxStamina"></div>
        <div class="stat-item"><span class="stat-label">回復力</span><input type="number" min="1" max="99" value="${p.recovery}" data-id="${i}" data-stat="recovery"></div>
      </div>
      <div class="stat-category">テクニカル</div>
      <div class="stat-line">
        <div class="stat-item"><span class="stat-label">シュート</span><input type="number" min="1" max="99" value="${p.sht}" data-id="${i}" data-stat="sht"></div>
        <div class="stat-item"><span class="stat-label">3P</span><input type="number" min="1" max="99" value="${p.tpt}" data-id="${i}" data-stat="tpt"></div>
        <div class="stat-item"><span class="stat-label">ドリブル</span><input type="number" min="1" max="99" value="${p.dribble}" data-id="${i}" data-stat="dribble"></div>
        <div class="stat-item"><span class="stat-label">パス</span><input type="number" min="1" max="99" value="${p.pas}" data-id="${i}" data-stat="pas"></div>
      </div>
      <div class="stat-line">
        <div class="stat-item"><span class="stat-label">マーク</span><input type="number" min="1" max="99" value="${p.marking}" data-id="${i}" data-stat="marking"></div>
        <div class="stat-item"><span class="stat-label">リバウンド</span><input type="number" min="1" max="99" value="${p.rebound}" data-id="${i}" data-stat="rebound"></div>
        <div class="stat-item"><span class="stat-label">スティール</span><input type="number" min="1" max="99" value="${p.stl}" data-id="${i}" data-stat="stl"></div>
        <div class="stat-item"><span class="stat-label">ハンドリング</span><input type="number" min="1" max="99" value="${p.handling}" data-id="${i}" data-stat="handling"></div>
      </div>
      <div class="stat-category">メンタル</div>
      <div class="stat-line">
        <div class="stat-item"><span class="stat-label">運動量</span><input type="number" min="1" max="99" value="${p.workrate}" data-id="${i}" data-stat="workrate"></div>
        <div class="stat-item"><span class="stat-label">視野</span><input type="number" min="1" max="99" value="${p.vision}" data-id="${i}" data-stat="vision"></div>
        <div class="stat-item"><span class="stat-label">チームワーク</span><input type="number" min="1" max="99" value="${p.teamwork}" data-id="${i}" data-stat="teamwork"></div>
        <div class="stat-item"><span class="stat-label">ポジショニング</span><input type="number" min="1" max="99" value="${p.positioning}" data-id="${i}" data-stat="positioning"></div>
      </div>
      <div class="stat-line">
        <div class="stat-item"><span class="stat-label">予測力</span><input type="number" min="1" max="99" value="${p.anticipation}" data-id="${i}" data-stat="anticipation"></div>
        <div class="stat-item"><span class="stat-label">判断力</span><input type="number" min="1" max="99" value="${p.decisions}" data-id="${i}" data-stat="decisions"></div>
        <div class="stat-item"><span class="stat-label">積極性</span><input type="number" min="1" max="99" value="${p.aggression}" data-id="${i}" data-stat="aggression"></div>
        <div class="stat-item"><span class="stat-label">反応速度</span><input type="number" min="1" max="99" value="${p.reactions}" data-id="${i}" data-stat="reactions"></div>
      </div>
    `;
    container.appendChild(row);
  });
  document.querySelectorAll('#roster input').forEach(inp => {
    inp.addEventListener('change', e => {
      let id = parseInt(e.target.dataset.id);
      let stat = e.target.dataset.stat;
      if(stat === 'maxStamina') {
        players[id][stat] = constrain(parseInt(e.target.value) || 100, 50, 200);
        players[id].stamina = min(players[id].stamina, players[id].maxStamina);
      } else if(stat === 'height') {
        players[id][stat] = constrain(parseInt(e.target.value) || 190, 160, 230);
      } else {
        players[id][stat] = constrain(parseInt(e.target.value) || 50, 1, 99);
      }
      e.target.value = players[id][stat];
    });
  });
}

function draw() {
  background(40,40,60);

  // ジャンプボール中は時間を止める（速度倍率対応）
  if (frameCount % Math.floor(60 / gameSpeed) === 0 && gameState === "playing" && !throwInState && !jumpBallState) {
    gameTime--; shotClock--;
    if (shotClock <= 0) shotClockViolation();
    if (gameTime <= 0) {
      quarter++; gameTime = 720;
      if(quarter > 4) { gameState = "end"; }
      else {
        // クォーター間：ジャンプボール
        let holder = players.find(p=>p.hasBall); if(holder) holder.hasBall = false;
        teamFouls.PlayerTeam = 0; teamFouls.DefenderTeam = 0; // クォーターファウルリセット
        startJumpBall();
      }
    }
  }
  updateUI();
  drawCourtAndBackboard();
  renderGoalBack(1, netRight); renderGoalBack(-1, netLeft);

  // フリースロー処理
  if(foulState && foulState.currentAttempt === 0 && frameCount % 120 === 0) {
    executeFreeThrow();
  }

  // ジャンプボール処理（速度倍率対応）
  if(jumpBallState) {
    for (let g = 0; g < gameSpeed; g++) updateJumpBall();
  } else if(!foulState) {
    for (let g = 0; g < gameSpeed; g++) {
      for (let i = 0; i < 2; i++) updatePhysics();
      players.forEach(p => { updatePlayerAI(p); updatePlayerPhysics(p); });
    }

    // 古いスクリーンとカットをクリーンアップ
    screens = screens.filter(s => frameCount - s.startTime < 300);
    cuts = cuts.filter(c => frameCount - c.startTime < 180);
  }
  
  ball.trail.push({x:ball.x,y:ball.y,z:ball.z});
  if(ball.trail.length > 15) ball.trail.shift();
  
  let entities = [...players, {isBall:true,...ball}];
  entities.sort((a,b) => a.y - b.y);
  entities.forEach(e => {
    if(e.isBall) { drawBallTrail(); drawEntity(ball.x,ball.y,ball.z,16,color(255,140,0),true); }
    else drawPlayer(e);
  });
  
  renderGoalFront(1, netRight); renderGoalFront(-1, netLeft);
  updateParticles(); updateFloatingTexts();
  drawScoreboard();
  
  if(throwInState) {
    fill(0,180); noStroke(); rect(width/2-120, height/2-25, 240, 50, 10);
    fill(255); textSize(14); textAlign(CENTER,CENTER);
    let teamName = throwInState.team === "PlayerTeam" ? "BLUE" : "RED";
    text(teamName + " BALL", width/2, height/2-8);
    textSize(11); fill(200);
    text(throwInState.reason, width/2, height/2+12);
    noFill(); stroke(255,255,0); strokeWeight(2);
    ellipse(throwInState.x, throwInState.y, 30 + sin(frameCount*0.1)*5, 15);
  }
}

function updateUI() {
  let m = floor(gameTime/60), s = gameTime%60;
  document.getElementById('gameInfo').textContent = `Q${quarter} ${m}:${s.toString().padStart(2,'0')}`;
  document.getElementById('shotClock').textContent = `SHOT: ${shotClock}`;
  document.getElementById('possession').textContent = `POSS: ${possession==="PlayerTeam"?"BLUE":possession==="DefenderTeam"?"RED":"--"}`;
}

function drawScoreboard() {
  fill(0,150); noStroke(); rect(width/2-120,10,240,45,10);
  fill(0,150,255); textSize(28); textStyle(BOLD); textAlign(RIGHT); text(scorePlayer, width/2-20, 42);
  fill(255,50,50); textAlign(LEFT); text(scoreDefender, width/2+20, 42);
  fill(255); textSize(16); textAlign(CENTER); text("-", width/2, 40);
  textSize(10); fill(0,150,255); textAlign(RIGHT); text("BLUE", width/2-55, 25);
  fill(255,50,50); textAlign(LEFT); text("RED", width/2+55, 25);
}

function drawPlayer(p) {
  let baseColor = p.team === "PlayerTeam" ? [0,150,255] : [255,50,50];
  let darkColor = p.team === "PlayerTeam" ? [0,100,200] : [200,30,30];

  // 影
  noStroke(); fill(0,40); ellipse(p.x, p.y, p.size*1.3, p.size*0.5);

  let yOff = p.z + (p.hasBall && !p.isJumping ? sin(p.dribblePhase)*2 : 0);
  let px = p.x, py = p.y - yOff;

  // 体（楕円＋方向表示）
  stroke(darkColor[0],darkColor[1],darkColor[2]); strokeWeight(2);
  fill(baseColor[0],baseColor[1],baseColor[2]);
  ellipse(px, py, p.size, p.size);

  // 方向を示す小さな三角（進行方向）
  if(p.currentSpeed > 0.3) {
    let dirX = cos(p.facingAngle) * 11;
    let dirY = sin(p.facingAngle) * 5;
    noStroke(); fill(255,255,255,120);
    triangle(px+dirX, py+dirY, px+dirX*0.3-dirY*0.4, py+dirY*0.3+dirX*0.08, px+dirX*0.3+dirY*0.4, py+dirY*0.3-dirX*0.08);
  }

  // ドリブルの腕の表現（進行方向横にボールを突く動き）
  if(p.hasBall && !p.isJumping && p.currentSpeed > 0.3) {
    let armX = cos(p.facingAngle) * 8;
    let armY = sin(p.facingAngle) * 4;
    stroke(baseColor[0]+40,baseColor[1]+40,baseColor[2]+40); strokeWeight(2);
    line(px, py, px + armX, py + armY + sin(p.dribblePhase) * 2);
  }

  // ポジション・背番号
  noStroke(); fill(255); textSize(8); textAlign(CENTER,CENTER);
  text(p.position, px, py - 3);
  textSize(6); fill(255,255,255,200); text(p.number, px, py + 6);

  // スタミナバー
  let stam = p.stamina / p.maxStamina;
  fill(30,30,30,150); rect(px-12, py-20, 24, 3, 1);
  let stColor = stam>0.5?[0,230,80]:stam>0.25?[255,180,0]:[255,40,40];
  fill(stColor[0],stColor[1],stColor[2]); rect(px-12, py-20, 24*stam, 3, 1);

  // ボール保持者のハイライト
  if(p.hasBall) {
    noFill(); stroke(255,255,0,100+sin(frameCount*0.15)*50); strokeWeight(2);
    ellipse(px, py, p.size+8+sin(frameCount*0.1)*3);
  }

  // ジャンプ中の高さ表示（ジャンプが見える）
  if(p.isJumping && p.z > 5) {
    stroke(255,255,255,60); strokeWeight(1);
    line(p.x, p.y, p.x, p.y - p.z);
  }

  // スクリーン中の表示
  if(p.isScreening) {
    noFill(); stroke(255,200,0,80); strokeWeight(3);
    arc(px, py, p.size+14, p.size+14, 0, PI);
  }
}

function drawBallTrail() {
  noFill();
  for(let i=0; i<ball.trail.length-1; i++) {
    let t = ball.trail[i], a = map(i,0,ball.trail.length,0,100);
    stroke(255,140,0,a); strokeWeight(map(i,0,ball.trail.length,2,8)); point(t.x, t.y - t.z);
  }
}

function updatePlayerPhysics(p) {
  if(p.isJumping) {
    p.vz -= BALL_GRAVITY * 0.5; p.z += p.vz;
    if(p.hasBall && p.mustShoot && p.vz <= 0) {
      // シュート前にブロック判定
      let nearBlocker = players.find(d => d.team !== p.team && (d.position === "C" || d.position === "PF") && dist(d.x,d.y,p.x,p.y) < 40 && d.lock <= 0);
      if(nearBlocker) attemptBlock(nearBlocker, p);
      if(p.hasBall) { // ブロックされなかった場合のみシュート
        let tg = p.team === "PlayerTeam" ? {x:finalGoal.ringX,y:finalGoal.ringY} : {x:1000-finalGoal.ringX,y:finalGoal.ringY};
        shoot(p, tg.x, tg.y, dist(p.x,p.y,tg.x,tg.y) > 180);
      }
    }
    if(p.z <= 0) { p.z = 0; p.vz = 0; p.isJumping = false; p.mustShoot = false; }
  }
  if(p.hasBall && !p.isJumping) p.dribblePhase += 0.3;

  // スタミナの増減: 移動距離と時間ベース
  let moveDist = dist(p.x, p.y, p.prevX, p.prevY);
  p.prevX = p.x; p.prevY = p.y;

  if(p.state === "idle") {
    // 回復力が高いほどスタミナ回復が早い
    let recoveryRate = map(p.recovery, 0, 100, 0.04, 0.12);
    p.stamina = min(p.maxStamina, p.stamina + recoveryRate);
  } else {
    // 移動距離に応じて減少 (1/5に調整)
    let staminaCost = (0.001 + moveDist * 0.0004) * p.staminaDecay;
    p.stamina = max(0, p.stamina - staminaCost);
  }
}

function updatePlayerAI(p) {
  // ゴール後の守備帰陣：素早く自陣に戻る
  if(p.returningToDefense) {
    p.speedMultiplier = SPEED_SPRINT;
    let pos = p.position;
    let idealX, idealY;
    if(pos === "PG" || pos === "SG") {
      idealX = p.team === "PlayerTeam" ? 300 : 700;
      idealY = pos === "PG" ? 350 : 420;
    } else if(pos === "SF") {
      idealX = p.team === "PlayerTeam" ? 250 : 750;
      idealY = 388.75;
    } else {
      idealX = p.team === "PlayerTeam" ? 200 : 800;
      idealY = pos === "PF" ? 340 : 430;
    }
    moveToward(p, idealX, idealY, p.spd * 0.045 * p.speedMultiplier);
    return;
  }

  // スローイン時：スロワーは指定位置へ、パスを出す。他の選手は受け取る位置へ
  if(throwInState && throwInState.thrower === p.id) {
    p.speedMultiplier = SPEED_JOG; // スローインは小走り
    moveToward(p, throwInState.x, throwInState.y, p.spd * 0.06);
    if(dist(p.x, p.y, throwInState.x, throwInState.y) < 20) {
      if(!p.hasBall) {
        p.hasBall = true; ball.x = p.x; ball.y = p.y; ball.z = 45;
      }
      // ボールを持ったら、近くの味方にパスを出す
      if(p.hasBall && frameCount % 60 > 30) {
        let teammates = players.filter(t => t.team === p.team && t.id !== p.id);
        let nearest = teammates.sort((a,b) => dist(p.x,p.y,a.x,a.y) - dist(p.x,p.y,b.x,b.y))[0];
        if(nearest && dist(p.x, p.y, nearest.x, nearest.y) < 300) {
          passTo(p, nearest);
          setTimeout(() => { if(throwInState) { possession = throwInState.team; throwInState = null; shotClock = 24; } }, 500);
        }
      }
    }
    return;
  }
  // スローイン時：スロワー以外の味方は受け取りやすい位置へ
  if(throwInState && p.team === throwInState.team && p.id !== throwInState.thrower) {
    p.speedMultiplier = SPEED_WALK; // 受け取る位置への微調整は歩き
    let thrower = players.find(pl => pl.id === throwInState.thrower);
    if(thrower) {
      // スロワーから適度な距離に移動
      let ang = atan2(p.y - thrower.y, p.x - thrower.x);
      let targetDist = 100 + (p.id % 3) * 30;
      let tx = thrower.x + cos(ang) * targetDist;
      let ty = thrower.y + sin(ang) * targetDist;
      moveToward(p, constrain(tx, 125, 875), constrain(ty, 275, 537.5), p.spd * 0.04);
    }
    return;
  }
  if(p.lock > 0) { p.lock--; }
  
  let isOffense = p.team === possession;
  let tg = p.team === "PlayerTeam" ? {x:finalGoal.ringX,y:finalGoal.ringY} : {x:1000-finalGoal.ringX,y:finalGoal.ringY};
  let og = p.team === "PlayerTeam" ? {x:1000-finalGoal.ringX,y:finalGoal.ringY} : {x:finalGoal.ringX,y:finalGoal.ringY};
  let baseSpeed = p.spd * 0.045 * (p.stamina/p.maxStamina * 0.4 + 0.6);
  let speed = baseSpeed * p.speedMultiplier;

  if(p.hasBall && p.lock <= 0) {
    p.state = "offense";
    let dToGoal = dist(p.x,p.y,tg.x,tg.y);
    let nearDefenders = players.filter(d => d.team !== p.team && dist(d.x,d.y,p.x,p.y) < 40);
    let dominated = nearDefenders.length >= 2;
    let pressured = nearDefenders.length >= 1;
    let teammates = players.filter(t => t.team===p.team && t.id!==p.id);

    // 速攻判断
    let forwardRange = 200;
    let enemiesForward = players.filter(d => {
      if(d.team === p.team) return false;
      let toEnemy = p.team === "PlayerTeam" ? d.x > p.x : d.x < p.x;
      return toEnemy && dist(p.x, p.y, d.x, d.y) < forwardRange;
    }).length;
    let alliesForward = teammates.filter(t => {
      let toGoal = p.team === "PlayerTeam" ? t.x > p.x : t.x < p.x;
      return toGoal && dist(p.x, p.y, t.x, t.y) < forwardRange;
    }).length;
    let outnumbered = enemiesForward - alliesForward >= 2;
    let fastBreak = alliesForward > enemiesForward && dToGoal > 200; // 速攻チャンス

    // パス頻度はポジション・状況・視野能力で決定
    let passBaseRate = map(p.vision, 0, 100, 0.02, 0.07);
    if(p.position === "PG") passBaseRate *= 1.6; // PGはパス多め
    if(pressured) passBaseRate *= 2.0; // プレッシャー下ではパス増加
    if(dominated) passBaseRate *= 3.0; // ダブルチーム時はパス必須

    // ①カッティング選手へのパス（最優先）
    let cuttingMate = teammates.find(t => t.isCutting && dist(p.x, p.y, t.x, t.y) < 250);
    if(cuttingMate && random() < passBaseRate * 1.5) {
      passTo(p, cuttingMate); return;
    }

    // ②オープンな味方へのパス（視野で検索範囲が広がる）
    let searchRange = map(p.vision, 0, 100, 150, 350);
    let bestPass = null, bestScore = -999;
    for(let t of teammates) {
      if(dist(p.x, p.y, t.x, t.y) > searchRange) continue;
      let tDistToGoal = dist(t.x, t.y, tg.x, tg.y);
      let nearestDefToT = Math.min(...players.filter(d => d.team !== p.team).map(d => dist(d.x,d.y,t.x,t.y)));
      let openness = min(nearestDefToT, 80); // オープン度
      let closerToGoal = dToGoal - tDistToGoal; // ゴールに近づくか
      let score = openness * 1.0 + closerToGoal * 0.5;
      if(t.position === "SG" && tDistToGoal < 200) score += 20; // SG3P圏内優遇
      if(t.position === "C" && tDistToGoal < 100) score += 25; // Cゴール下優遇
      if(score > bestScore) { bestScore = score; bestPass = t; }
    }
    if(bestPass && random() < passBaseRate && bestScore > 30) {
      passTo(p, bestPass); return;
    }

    // ③PGへの戻しパス（展開のため）
    if(p.position !== "PG" && dToGoal > 150) {
      let pgMate = teammates.find(t => t.position === "PG" && dist(p.x, p.y, t.x, t.y) < 250);
      if(pgMate && pressured && random() < passBaseRate * 1.3) {
        passTo(p, pgMate); return;
      }
    }

    // ④ピック&ロール開始（PG/SG主導）
    if((p.position === "PG" || p.position === "SG") && random() < 0.015 && dToGoal < 250) {
      initiateScreen(p);
    }

    // ⑤速攻：前方のフリーな味方にロングパス
    if(fastBreak) {
      p.speedMultiplier = SPEED_SPRINT;
      let fwdMate = teammates.find(t => {
        let isAhead = p.team === "PlayerTeam" ? t.x > p.x + 80 : t.x < p.x - 80;
        return isAhead && dist(t.x,t.y,tg.x,tg.y) < 200;
      });
      if(fwdMate && random() < 0.05) { passTo(p, fwdMate); return; }
      moveToward(p, tg.x, tg.y, speed * SPEED_SPRINT);
      return;
    }

    // ⑥数的不利時：無理せず展開
    if(outnumbered && dToGoal > 150) {
      p.speedMultiplier = SPEED_JOG;
      if(bestPass && random() < 0.04) { passTo(p, bestPass); return; }
      let waitX = p.team === "PlayerTeam" ? p.x - 15 : p.x + 15;
      moveToward(p, waitX, p.y, speed * 0.4);
      return;
    }

    // ⑦シュート判断（ポジション別・状況別）
    let shootDist = 160, shootChance = 0.03;
    if(p.position === "SG") { shootDist = 220; shootChance = 0.04; }
    else if(p.position === "SF") { shootDist = 190; shootChance = 0.035; }
    else if(p.position === "C" || p.position === "PF") { shootDist = 130; shootChance = 0.04; }
    else if(p.position === "PG") { shootDist = 200; shootChance = 0.025; }

    // プレッシャーなし＋射程内でシュート確率UP
    if(!pressured && dToGoal < shootDist * 0.7) shootChance *= 2.0;
    // ダブルチームされてたら無理に打たない
    if(dominated) shootChance *= 0.2;

    if(dToGoal < shootDist && random() < shootChance && !p.isJumping) {
      p.isJumping = true; p.mustShoot = true;
      p.vz = sqrt(2 * map(p.jmp,0,100,50,100) * (BALL_GRAVITY * 0.5));
      return;
    }

    // ⑧ドライブ（ディフェンダー回避しながらゴールへ）
    p.speedMultiplier = pressured ? SPEED_RUN : SPEED_SPRINT;
    let avoidX = 0, avoidY = 0;
    players.filter(d=>d.team!==p.team).forEach(d => {
      let dd = dist(p.x,p.y,d.x,d.y);
      if(dd < 55 && dd > 0) { avoidX += (p.x-d.x)/dd*2.5; avoidY += (p.y-d.y)/dd*2.5; }
    });
    moveToward(p, tg.x + avoidX*12, tg.y + avoidY*12, speed);
    
  } else if(isOffense && p.lock <= 0) {
    p.state = "support";
    p.speedMultiplier = SPEED_RUN; // オフェンスサポートは走る
    let handler = players.find(pl=>pl.hasBall);
    if(handler) {
      // スクリーン実行中
      if(p.isScreening && p.screenTimer > 0) {
        p.screenTimer--;
        p.speedMultiplier = SPEED_WALK;
        // スクリーン位置：ボールハンドラーのディフェンダーの前
        let handlerDefender = players.find(d => d.team !== p.team && dist(d.x, d.y, handler.x, handler.y) < 50);
        if(handlerDefender) {
          let ang = atan2(handler.y - handlerDefender.y, handler.x - handlerDefender.x);
          let screenX = handlerDefender.x + cos(ang) * 30;
          let screenY = handlerDefender.y + sin(ang) * 30;
          moveToward(p, screenX, screenY, speed * 0.3);
        }
        if(p.screenTimer <= 0) {
          // スクリーン完了後：ロール（ゴールに向かってカット）
          p.isScreening = false;
          initiateCut(p, "baseline");
        }
        return;
      }

      // カッティング実行中
      if(p.isCutting && p.cutTarget) {
        p.speedMultiplier = SPEED_SPRINT;
        moveToward(p, p.cutTarget.x, p.cutTarget.y, speed);
        if(dist(p.x, p.y, p.cutTarget.x, p.cutTarget.y) < 30) {
          p.isCutting = false;
          p.cutTarget = null;
        }
        return;
      }

      // カッティング開始判定（SG/SFが主に実行）
      if((p.position === "SG" || p.position === "SF") && random() < 0.015 && !p.isCutting) {
        // ディフェンダーが離れている時にバックドアカット
        let nearestDef = players.filter(d => d.team !== p.team)
          .sort((a, b) => dist(a.x, a.y, p.x, p.y) - dist(b.x, b.y, p.x, p.y))[0];
        if(nearestDef && dist(nearestDef.x, nearestDef.y, p.x, p.y) > 60) {
          initiateCut(p, "backdoor");
          return;
        }
      }

      // フロアバランスを考慮したポジション別位置取り
      // 5つのスポットに分散（コーナー2、ウイング2、トップ1）
      let pos = p.position;
      let targetX, targetY;
      let side = p.team === "PlayerTeam" ? 1 : -1;

      // 各ポジションの理想的なスポット（ゴール基準の相対位置）
      if(pos === "PG") {
        // PG: トップ・オブ・ザ・キー（ゴールから離れた中央）
        targetX = tg.x - side * 160;
        targetY = tg.y;
        // ボール持ちが他にいる場合、ウイング寄りに移動
        if(handler.position !== "PG") {
          targetY = tg.y + (p.y > tg.y ? 40 : -40);
        }
        p.speedMultiplier = SPEED_JOG;
      } else if(pos === "SG") {
        // SG: ウイング/3Pライン付近（得点圏）
        let wingY = p.id % 2 === 0 ? tg.y - 80 : tg.y + 80; // 上下に散らばる
        targetX = tg.x - side * 130;
        targetY = wingY;
        p.speedMultiplier = SPEED_RUN;
      } else if(pos === "SF") {
        // SF: 逆サイドのウイング（フロアを広く使う）
        let wingY = p.id % 2 === 0 ? tg.y + 70 : tg.y - 70;
        targetX = tg.x - side * 100;
        targetY = wingY;
        p.speedMultiplier = SPEED_RUN;
      } else if(pos === "PF") {
        // PF: ハイポスト/エルボー（中間地帯）
        let cycle = (frameCount % 360) / 360;
        let idealDist = 90 + sin(cycle * TWO_PI) * 40; // 内外を行き来
        targetX = tg.x - side * idealDist;
        targetY = tg.y + (p.id % 2 === 0 ? -55 : 55);
        p.speedMultiplier = SPEED_RUN;
      } else { // C
        // C: ローポスト/ペイントエリア（ゴール近く）
        targetX = tg.x - side * 50;
        targetY = tg.y + (p.id % 2 === 0 ? 40 : -40);
        p.speedMultiplier = SPEED_JOG;
      }

      // 他の味方との重なりを回避（フロアスペーシング）
      let myTeammates = players.filter(t => t.team === p.team && t.id !== p.id && t.id !== handler.id);
      for(let t of myTeammates) {
        let dd = dist(targetX, targetY, t.x, t.y);
        if(dd < 60 && dd > 0) {
          let pushAng = atan2(targetY - t.y, targetX - t.x);
          targetX += cos(pushAng) * (60 - dd) * 0.5;
          targetY += sin(pushAng) * (60 - dd) * 0.5;
        }
      }

      // ハンドラーから離れすぎないように（パスが届く距離）
      let distToHandler = dist(targetX, targetY, handler.x, handler.y);
      if(distToHandler > 220) {
        targetX = lerp(targetX, handler.x, 0.3);
        targetY = lerp(targetY, handler.y, 0.3);
      }

      moveToward(p, constrain(targetX,125,875), constrain(targetY,275,537.5), speed*0.8);
    } else {
      // ボール保持者がいない場合（ルーズボール/リバウンド）
      if(ball.z < 80 && !players.some(pl=>pl.hasBall)) {
        p.speedMultiplier = SPEED_SPRINT; // ルーズボールは全速力
        moveToward(p, ball.x, ball.y, speed);
        if(dist(p.x,p.y,ball.x,ball.y) < 30 && ball.z < 40 && p.lock <= 0) {
          // リバウンド能力を考慮した獲得判定（オフェンスリバウンドは難しい）
          let reboundChance = map(p.rebound, 0, 100, 0.2, 0.7);
          reboundChance *= (1 + (p.jmp + p.power) / 400);
          reboundChance *= map(p.height, 160, 230, 0.85, 1.15);

          if(random() < reboundChance) {
            p.hasBall = true; possession = p.team; shotClock = 24;
            addFloatingText(p.x, p.y - 40, "OFF REBOUND!", [255, 200, 100]);
          }
        }
      } else {
        // 理想的なオフェンスポジションへ移動
        p.speedMultiplier = SPEED_JOG;
        let pos = p.position;
        let idealX, idealY;
        if(pos === "PG") {
          idealX = p.team === "PlayerTeam" ? 400 : 600;
          idealY = 388.75;
        } else if(pos === "SG" || pos === "SF") {
          idealX = p.team === "PlayerTeam" ? 650 : 350;
          idealY = pos === "SG" ? 320 : 450;
        } else {
          idealX = p.team === "PlayerTeam" ? 750 : 250;
          idealY = pos === "PF" ? 340 : 430;
        }
        moveToward(p, constrain(idealX,125,875), constrain(idealY,275,537.5), speed*0.5);
      }
    }
  } else if(!isOffense) {
    p.state = "defense";
    let handler = players.find(pl=>pl.hasBall);
    let retreatX = p.team === "PlayerTeam" ? 250 : 750;
    let inPos = p.team === "PlayerTeam" ? p.x < 437.5 : p.x > 562.5;

    if(!inPos && handler) {
      p.speedMultiplier = SPEED_RUN; // 守備位置への移動は走る
      moveToward(p, retreatX, p.y, speed);
    } else if(handler) {
      // ボックスアウト実行中（シュート後のリバウンド）
      if(p.isBoxingOut && p.boxOutTarget !== null) {
        let boxTarget = players[p.boxOutTarget];
        if(boxTarget && ball.z > 50) {
          p.speedMultiplier = SPEED_WALK;
          // 相手とゴールの間に入る
          let tg = p.team === "PlayerTeam" ? {x:finalGoal.ringX, y:finalGoal.ringY} : {x:1000-finalGoal.ringX, y:finalGoal.ringY};
          let ang = atan2(tg.y - boxTarget.y, tg.x - boxTarget.x);
          let boxX = boxTarget.x + cos(ang) * 25;
          let boxY = boxTarget.y + sin(ang) * 25;
          moveToward(p, boxX, boxY, speed * 0.5);
          return;
        } else if(ball.z < 20) {
          p.isBoxingOut = false;
          p.boxOutTarget = null;
        }
      }

      // ヘルプディフェンス判定
      if(checkHelpDefense(p) && p.helpTarget !== null) {
        let helpPlayer = players[p.helpTarget];
        if(helpPlayer && helpPlayer.hasBall) {
          p.speedMultiplier = SPEED_SPRINT;
          // ボール保持者とゴールの間に入る
          let tg = p.team === "PlayerTeam" ? {x:finalGoal.ringX, y:finalGoal.ringY} : {x:1000-finalGoal.ringX, y:finalGoal.ringY};
          let helpX = (helpPlayer.x + tg.x) / 2;
          let helpY = (helpPlayer.y + tg.y) / 2;
          moveToward(p, helpX, helpY, speed);

          // ヘルプ後のスティール試行
          if(dist(p.x, p.y, helpPlayer.x, helpPlayer.y) < 30 && random(100) < p.stl * 0.04 && p.lock <= 0) {
            attemptSteal(p, helpPlayer);
          }
          return;
        } else {
          p.helpDefense = false;
          p.helpTarget = null;
        }
      }

      p.speedMultiplier = SPEED_JOG; // マークは小走り
      // 同じポジションの相手選手をマーク
      let mark = players.filter(t=>t.team!==p.team)[p.id%5];
      if(mark) {
        // ファウルチェック
        checkFoul(p, mark);
        // ポジション別のディフェンス重点
        let pos = p.position;
        let markWeight, goalWeight, ballWeight;

        if(pos === "PG" || pos === "SG") {
          // PG/SG: マークマンとボール保持者を重視（外周のプレッシャー）
          markWeight = 0.4;
          goalWeight = 0.3;
          ballWeight = handler.id === mark.id ? 0.5 : 0.3;
        } else if(pos === "SF") {
          // SF: バランス型
          markWeight = 0.35;
          goalWeight = 0.4;
          ballWeight = handler.id === mark.id ? 0.5 : 0.25;
        } else { // PF, C
          // PF/C: ゴールとリバウンドを重視（ペイントエリア防衛）
          markWeight = 0.25;
          goalWeight = 0.6;
          ballWeight = handler.id === mark.id ? 0.4 : 0.15;
        }

        // マークマン、ゴール、ボール保持者の3点を考慮
        let totalWeight = markWeight + goalWeight + ballWeight;
        let defX = (mark.x * markWeight + og.x * goalWeight + handler.x * ballWeight) / totalWeight;
        let defY = (mark.y * markWeight + og.y * goalWeight + handler.y * ballWeight) / totalWeight;

        // 守備側は自陣から出ないように制限（相手コートに行かない）
        if(p.team === "PlayerTeam") {
          defX = min(defX, 480); // 青チームは左側に留まる
        } else {
          defX = max(defX, 520); // 赤チームは右側に留まる
        }

        // マークマンとボール保持者に近い場合は全速力
        let distToMark = dist(p.x, p.y, mark.x, mark.y);
        if(mark.hasBall && distToMark > 50) {
          p.speedMultiplier = SPEED_SPRINT;
        } else if(distToMark < 30) {
          p.speedMultiplier = SPEED_WALK; // 至近距離は歩き
        }

        moveToward(p, defX, defY, speed*0.75);
        if(mark.hasBall && dist(p.x,p.y,mark.x,mark.y) < 30 && random(100) < p.stl * 0.06 && p.lock <= 0) attemptSteal(p, mark);
      }
    } else if(ball.z < 80 && !players.some(pl=>pl.hasBall)) {
      // ルーズボール/リバウンド：全速力で追う
      p.speedMultiplier = SPEED_SPRINT;
      moveToward(p, ball.x, ball.y, speed);
      if(dist(p.x,p.y,ball.x,ball.y) < 30 && ball.z < 40 && p.lock <= 0) {
        // リバウンド能力を考慮した獲得判定
        let reboundChance = map(p.rebound, 0, 100, 0.3, 0.9);
        // ジャンプ力とパワーも影響
        reboundChance *= (1 + (p.jmp + p.power) / 400);
        // 身長も影響
        reboundChance *= map(p.height, 160, 230, 0.85, 1.15);

        if(random() < reboundChance) {
          p.hasBall = true; possession = p.team; shotClock = 24;
          p.isBoxingOut = false;
          addFloatingText(p.x, p.y - 40, "REBOUND!", [100, 255, 200]);
        }
      }
    } else {
      // ボール保持者がいない場合：守備位置へ小走り
      p.speedMultiplier = SPEED_JOG;
      let pos = p.position;
      let idealX, idealY;
      if(pos === "PG" || pos === "SG") {
        idealX = p.team === "PlayerTeam" ? 300 : 700;
        idealY = pos === "PG" ? 350 : 420;
      } else if(pos === "SF") {
        idealX = p.team === "PlayerTeam" ? 250 : 750;
        idealY = 388.75;
      } else {
        idealX = p.team === "PlayerTeam" ? 200 : 800;
        idealY = pos === "PF" ? 340 : 430;
      }
      moveToward(p, constrain(idealX,125,875), constrain(idealY,275,537.5), speed*0.4);
    }
  }
}

function moveToward(p, tx, ty, targetSpeed) {
  // 瞬発力による滑らかな加速システム
  // 瞬発力が高いほど早くトップスピードに到達
  let accelerationRate = map(p.acceleration, 0, 100, 0.03, 0.15);

  // 現在の速度を目標速度に向けて調整
  if(p.currentSpeed < targetSpeed) {
    // 加速
    p.currentSpeed = min(targetSpeed, p.currentSpeed + accelerationRate * targetSpeed);
  } else if(p.currentSpeed > targetSpeed) {
    // 減速（加速よりも速く減速）
    p.currentSpeed = max(targetSpeed, p.currentSpeed - accelerationRate * targetSpeed * 1.5);
  }

  // 現在の速度で移動
  let a = atan2(ty-p.y, tx-p.x);
  if(p.currentSpeed > 0.3) p.facingAngle = a; // 移動中のみ向きを更新
  p.x = constrain(p.x + cos(a)*p.currentSpeed, 25, 975);
  p.y = constrain(p.y + sin(a)*p.currentSpeed, 262.5, 550);
}

function passTo(passer, receiver) {
  passer.hasBall = false; passer.lock = 20;
  let d = dist(passer.x, passer.y, receiver.x, receiver.y);
  let spd = map(passer.pas, 0, 100, 5, 9), t = d / spd;
  ball.vx = (receiver.x - ball.x) / t;
  ball.vy = (receiver.y - ball.y) / t;
  ball.vz = map(d, 50, 300, 1.5, 4) + (BALL_GRAVITY * t * 0.2);
  ball.passTarget = receiver.id; ball.lastTouch = passer.team;
  for(let i=0;i<5;i++) particles.push({x:passer.x,y:passer.y-passer.z,vx:random(-1,1),vy:random(-2,0),life:20,color:[255,255,200]});
}

function shoot(s, tx, ty, is3pt) {
  s.hasBall = false; s.mustShoot = false; goalChecked = false; s.lock = 60;
  let d = dist(s.x, s.y, tx, ty);
  let acc = is3pt ? s.tpt : s.sht;

  // 飛行時間（距離に応じてフレーム数を決定）
  let t = map(d, 50, 300, 25, 42);

  // 能力ベースの誤差（大幅軽減：確実にゴールに向かう弾道）
  let baseErr = map(acc, 0, 100, 6, 0.3);
  let distanceFactor = map(d, 50, 250, 1.0, 2.0);
  if(is3pt) { distanceFactor *= map(acc, 0, 100, 1.0, 0.3); }
  let staminaFactor = (s.stamina/s.maxStamina * 0.2 + 0.8);

  // ディフェンダーが近いほど精度が下がる（コンテスト効果）
  let contestFactor = 1.0;
  let nearestDef = players.filter(p => p.team !== s.team)
    .reduce((c, p) => dist(p.x,p.y,s.x,s.y) < dist(c.x,c.y,s.x,s.y) ? p : c, {x:9999,y:9999});
  let defDist = dist(nearestDef.x, nearestDef.y, s.x, s.y);
  if(defDist < 30) contestFactor = 1.8;
  else if(defDist < 50) contestFactor = 1.3;

  let err = baseErr * distanceFactor * staminaFactor * contestFactor;

  // シュートの方向オフセット（ゴール方向の微調整）
  let dirX = s.team === "PlayerTeam" ? 3 : -3;
  ball.vx = (tx + dirX + random(-err, err) - ball.x) / t;
  ball.vy = (ty + random(-err*0.3, err*0.3) - ball.y) / t;

  // 重力補正を正確に計算（離散物理の補正）
  // 物理ステップあたりの実効重力: BALL_GRAVITY * 0.5, ステップ数: 2*t (2回/フレーム)
  let totalSteps = t * 2;
  let gravPerStep = BALL_GRAVITY * 0.5;
  let targetZ = finalGoal.ringZ + 8; // リングより少し上を狙う（弧を描く）
  ball.vz = ((targetZ - ball.z) / (totalSteps * 0.5)) + (gravPerStep * totalSteps * 0.5 * 0.5);

  ball.shooterTeam = s.team; ball.is3pt = is3pt; ball.lastTouch = s.team; ball.passTarget = null;
  for(let i=0;i<8;i++) particles.push({x:s.x,y:s.y-s.z-20,vx:random(-2,2),vy:random(-3,0),life:25,color:[255,255,0]});

  // シュート時：全員リバウンドポジション取り開始
  players.forEach(p => positionForRebound(p));
}

function attemptSteal(stealer, handler) {
  if(random(100) < stealer.stl - handler.handling * 0.3) {
    handler.hasBall = false; stealer.hasBall = true;
    possession = stealer.team; shotClock = 24;
    addFloatingText(stealer.x, stealer.y - 40, "STEAL!", [0,255,100]);
  }
  stealer.lock = 40;
}

function attemptBlock(blocker, shooter) {
  if(blocker.isJumping || blocker.lock > 0) return;
  let d = dist(blocker.x, blocker.y, shooter.x, shooter.y);
  if(d > 40) return;
  // ブロック確率：ブロック能力＋身長＋ジャンプ力
  let blockChance = map(blocker.blk, 0, 100, 0.01, 0.12);
  blockChance *= map(blocker.height, 160, 230, 0.7, 1.3);
  blockChance *= map(blocker.jmp, 0, 100, 0.8, 1.2);
  if(random() < blockChance) {
    // ブロック成功！
    blocker.isJumping = true;
    blocker.vz = sqrt(2 * map(blocker.jmp,0,100,40,90) * (BALL_GRAVITY * 0.5));
    // ボールを弾く
    ball.vx = (random() > 0.5 ? 1 : -1) * random(3, 6);
    ball.vy = random(-3, 3);
    ball.vz = random(1, 4);
    ball.lastTouch = blocker.team;
    ball.passTarget = null;
    addFloatingText(blocker.x, blocker.y - 50, "BLOCK!", [255, 100, 255]);
    blocker.lock = 30;
  }
}

// ピック＆ロール（スクリーンプレイ）開始
function initiateScreen(ballHandler) {
  if(!ballHandler || ballHandler.isScreening) return;

  // PF/Cがスクリーンに来る（ビッグマンの役割）
  let teammates = players.filter(p => p.team === ballHandler.team && p.id !== ballHandler.id);
  let screener = teammates.find(p => (p.position === "PF" || p.position === "C") && !p.isScreening && dist(p.x, p.y, ballHandler.x, ballHandler.y) < 150);

  if(screener) {
    screener.isScreening = true;
    screener.screenTarget = ballHandler.id;
    screener.screenTimer = 180; // 3秒間
    screens.push({screener: screener.id, ballHandler: ballHandler.id, startTime: frameCount, completed: false});
  }
}

// カッティング動作開始
function initiateCut(player, type) {
  if(!player || player.isCutting) return;

  let tg = player.team === "PlayerTeam" ? {x:finalGoal.ringX, y:finalGoal.ringY} : {x:1000-finalGoal.ringX, y:finalGoal.ringY};
  let targetX, targetY;

  if(type === "backdoor") {
    // バックドアカット：ディフェンスの裏をかいてゴール下へ
    targetX = tg.x + (player.team === "PlayerTeam" ? 30 : -30);
    targetY = tg.y + random(-20, 20);
  } else if(type === "baseline") {
    // ベースラインカット：ベースライン沿いにゴール下へ
    targetX = tg.x + (player.team === "PlayerTeam" ? 40 : -40);
    targetY = player.y > 388.75 ? 520 : 260;
  }

  player.isCutting = true;
  player.cutTarget = {x: targetX, y: targetY};
  player.cutType = type;
  cuts.push({cutter: player.id, type, targetX, targetY, startTime: frameCount});
}

// ヘルプディフェンス判定
function checkHelpDefense(defender) {
  if(!defender || defender.team === possession) return false;

  let handler = players.find(p => p.hasBall);
  if(!handler) return false;

  // ボール保持者がゴールに近く、マークマンが離れている場合はヘルプ
  let tg = defender.team === "PlayerTeam" ? {x:finalGoal.ringX, y:finalGoal.ringY} : {x:1000-finalGoal.ringX, y:finalGoal.ringY};
  let distToGoal = dist(handler.x, handler.y, tg.x, tg.y);
  let mark = players[defender.id % 5 + (defender.team === "PlayerTeam" ? 5 : 0)];

  if(distToGoal < 120 && mark && dist(defender.x, defender.y, mark.x, mark.y) > 80) {
    defender.helpDefense = true;
    defender.helpTarget = handler.id;
    return true;
  }

  return false;
}

// リバウンドポジショニング（ボックスアウト）
function positionForRebound(player) {
  if(!ball.shooterTeam || player.isBoxingOut) return;

  let tg = ball.shooterTeam === "PlayerTeam" ? {x:finalGoal.ringX, y:finalGoal.ringY} : {x:1000-finalGoal.ringX, y:finalGoal.ringY};
  let isOffensiveRebound = player.team === ball.shooterTeam;

  // ディフェンスリバウンド：オフェンス選手をボックスアウト
  if(!isOffensiveRebound) {
    let nearestOffender = players.filter(p => p.team !== player.team)
      .sort((a, b) => dist(a.x, a.y, tg.x, tg.y) - dist(b.x, b.y, tg.x, tg.y))[0];

    if(nearestOffender) {
      player.isBoxingOut = true;
      player.boxOutTarget = nearestOffender.id;
    }
  }
}

// ファウル判定
function checkFoul(defender, offender) {
  if(!defender || !offender || foulState) return false;

  let d = dist(defender.x, defender.y, offender.x, offender.y);

  // シューティングファウルの判定
  if(offender.isJumping && offender.mustShoot && d < 25) {
    let foulChance = map(defender.aggression, 0, 100, 0.01, 0.04);
    if(random() < foulChance) {
      commitFoul(defender, offender, "shooting");
      return true;
    }
  }

  // チャージング（オフェンスファウル）の判定
  if(offender.hasBall && !offender.isJumping && d < 20) {
    let chargeChance = map(defender.positioning, 0, 100, 0.005, 0.015);
    if(random() < chargeChance && defender.currentSpeed < 0.5) {
      commitFoul(offender, defender, "offensive");
      return true;
    }
  }

  return false;
}

// ファウル処理
function commitFoul(fouler, victim, type) {
  playerFouls[fouler.id] = (playerFouls[fouler.id] || 0) + 1;
  teamFouls[fouler.team]++;

  if(type === "shooting") {
    // シューティングファウル：フリースロー
    let attempts = ball.is3pt ? 3 : 2;
    foulState = {shooter: victim.id, team: victim.team, attempts, currentAttempt: 0, made: 0};
    addFloatingText(fouler.x, fouler.y - 40, "FOUL!", [255, 200, 0]);
    addFloatingText(500, 300, `SHOOTING FOUL - ${attempts} FREE THROWS`, [255, 255, 100]);
  } else if(type === "offensive") {
    // オフェンスファウル：相手ボール
    fouler.hasBall = false;
    let newTeam = fouler.team === "PlayerTeam" ? "DefenderTeam" : "PlayerTeam";
    possession = newTeam;
    shotClock = 24;
    startThrowIn(newTeam, fouler.team === "PlayerTeam" ? 937.5 : 62.5, 406.25, "OFFENSIVE FOUL");
    addFloatingText(fouler.x, fouler.y - 40, "CHARGE!", [255, 100, 100]);
  }

  // 5ファウルで退場
  if(playerFouls[fouler.id] >= 5) {
    addFloatingText(fouler.x, fouler.y - 60, "FOULED OUT!", [255, 50, 50]);
  }
}

// フリースロー実行
function executeFreeThrow() {
  if(!foulState) return;

  let shooter = players[foulState.shooter];
  if(!shooter) return;

  // シューターをフリースローラインに配置
  let ftX = shooter.team === "PlayerTeam" ? 715 : 1000 - 715;
  let ftY = 383.75;
  shooter.x = ftX;
  shooter.y = ftY;
  shooter.hasBall = true;
  ball.x = shooter.x;
  ball.y = shooter.y;
  ball.z = 45;

  // 他の選手をペイントエリア周辺に配置
  let others = players.filter(p => p.id !== shooter.id);
  let positions = [
    {x: ftX + (shooter.team === "PlayerTeam" ? 50 : -50), y: 356.25},
    {x: ftX + (shooter.team === "PlayerTeam" ? 50 : -50), y: 411.25},
    {x: ftX + (shooter.team === "PlayerTeam" ? 70 : -70), y: 342.5},
    {x: ftX + (shooter.team === "PlayerTeam" ? 70 : -70), y: 420},
  ];

  for(let i = 0; i < min(others.length, positions.length); i++) {
    others[i].x = positions[i].x;
    others[i].y = positions[i].y;
  }

  // シュート
  setTimeout(() => {
    if(foulState) {
      let tg = shooter.team === "PlayerTeam" ? {x:finalGoal.ringX, y:finalGoal.ringY} : {x:1000-finalGoal.ringX, y:finalGoal.ringY};
      let accuracy = map(shooter.sht, 0, 100, 0.5, 0.9); // フリースローは高確率

      if(random() < accuracy) {
        // 成功
        foulState.made++;
        let pts = 1;
        if(shooter.team === "PlayerTeam") {
          scorePlayer += pts;
          quarterScoresPlayer[quarter - 1] += pts;
        } else {
          scoreDefender += pts;
          quarterScoresDefender[quarter - 1] += pts;
        }
        shoot(shooter, tg.x, tg.y, false);
        addFloatingText(ftX, ftY - 50, "+1!", [0, 255, 100]);
      } else {
        // 失敗
        shoot(shooter, tg.x, tg.y, false);
        addFloatingText(ftX, ftY - 50, "MISS", [255, 100, 100]);
      }

      foulState.currentAttempt++;

      // すべてのフリースローが終了
      if(foulState.currentAttempt >= foulState.attempts) {
        setTimeout(() => {
          let newTeam = shooter.team === "PlayerTeam" ? "DefenderTeam" : "PlayerTeam";
          startThrowIn(newTeam, shooter.team === "PlayerTeam" ? 975 : 25, 406.25, "INBOUND");
          foulState = null;
        }, 2000);
      } else {
        // 次のフリースロー
        setTimeout(() => executeFreeThrow(), 2000);
      }
    }
  }, 1500);
}

function shotClockViolation() {
  let newTeam = possession === "PlayerTeam" ? "DefenderTeam" : "PlayerTeam";
  let holder = players.find(p=>p.hasBall); if(holder) holder.hasBall = false;
  let thX = possession === "PlayerTeam" ? 937.5 : 62.5;
  let thrower = players.find(p => p.team === newTeam && p.position === "PG");
  throwInState = { team: newTeam, x: thX, y: 406.25, reason: "SHOT CLOCK VIOLATION", thrower: thrower ? thrower.id : (newTeam==="PlayerTeam"?0:5) };
  ball.vx = 0; ball.vy = 0; ball.vz = 0;
  addFloatingText(500, 350, "24 SEC VIOLATION", [255,100,100]);
}

function startThrowIn(team, x, y, reason) {
  let holder = players.find(p=>p.hasBall); if(holder) holder.hasBall = false;
  let thrower = players.find(p => p.team === team && p.position === "PG");
  throwInState = { team, x, y, reason, thrower: thrower ? thrower.id : (team==="PlayerTeam"?0:5) };
  ball.vx = 0; ball.vy = 0; ball.vz = 0;
}

function startJumpBall() {
  let playerTeamJumper = players.filter(p => p.team === "PlayerTeam")
    .sort((a, b) => (b.height + b.jmp) - (a.height + a.jmp))[0];
  let defenderTeamJumper = players.filter(p => p.team === "DefenderTeam")
    .sort((a, b) => (b.height + b.jmp) - (a.height + a.jmp))[0];

  jumpBallState = {
    jumper1: playerTeamJumper.id,
    jumper2: defenderTeamJumper.id,
    phase: 0, // 0=準備, 1=ボール上昇, 2=両者ジャンプ, 3=タップ, 4=ボール飛行
    timer: 0,
    winner: null,
    tipTarget: null
  };

  ball.x = 500; ball.y = 388.75; ball.z = 80;
  ball.vx = 0; ball.vy = 0; ball.vz = 0;

  // 全選手をセンターサークル周囲に配置
  let j1 = playerTeamJumper, j2 = defenderTeamJumper;
  j1.x = 492; j1.y = 388.75; j1.z = 0; j1.vz = 0; j1.isJumping = false;
  j2.x = 508; j2.y = 388.75; j2.z = 0; j2.vz = 0; j2.isJumping = false;

  let otherBlue = players.filter(p => p.team === "PlayerTeam" && p.id !== j1.id);
  let otherRed = players.filter(p => p.team === "DefenderTeam" && p.id !== j2.id);
  let circlePos = [
    {x:500,y:315}, {x:570,y:340}, {x:590,y:388.75}, {x:570,y:437.5},
    {x:500,y:462.5}, {x:430,y:437.5}, {x:410,y:388.75}, {x:430,y:340}
  ];
  for(let i = 0; i < 4; i++) {
    if(otherBlue[i]) { otherBlue[i].x = circlePos[i*2].x; otherBlue[i].y = circlePos[i*2].y; }
    if(otherRed[i]) { otherRed[i].x = circlePos[i*2+1].x; otherRed[i].y = circlePos[i*2+1].y; }
  }

  addFloatingText(500, 340, "JUMP BALL!", [255, 255, 255]);
}

function updateJumpBall() {
  if(!jumpBallState) return;
  let j1 = players[jumpBallState.jumper1];
  let j2 = players[jumpBallState.jumper2];
  jumpBallState.timer++;
  let t = jumpBallState.timer;

  if(jumpBallState.phase === 0) {
    // 準備フェーズ：審判がボールを持っている演出（60フレーム=1秒）
    ball.x = 500; ball.y = 388.75; ball.z = 80;
    if(t > 60) { jumpBallState.phase = 1; jumpBallState.timer = 0; }
  }
  else if(jumpBallState.phase === 1) {
    // ボール上昇：審判がトスアップ
    ball.z = 80 + t * 3;
    if(ball.z >= 180) { jumpBallState.phase = 2; jumpBallState.timer = 0; }
  }
  else if(jumpBallState.phase === 2) {
    // 両選手がジャンプ
    ball.z = 180;
    let jumpHeight1 = map(j1.jmp, 0, 100, 25, 55);
    let jumpHeight2 = map(j2.jmp, 0, 100, 25, 55);

    j1.z = min(t * 3.5, jumpHeight1);
    j2.z = min(t * 3.5, jumpHeight2);
    j1.isJumping = true;
    j2.isJumping = true;

    if(t > 18) {
      // 最高到達点で勝者決定：身長+ジャンプ力+ランダム
      let reach1 = j1.height + j1.jmp * 0.8 + random(-15, 15);
      let reach2 = j2.height + j2.jmp * 0.8 + random(-15, 15);
      let winner = reach1 > reach2 ? j1 : j2;
      jumpBallState.winner = winner;

      // 勝者の最も近い味方を探す
      let teammates = players.filter(p => p.team === winner.team && p.id !== winner.id);
      let nearest = teammates.sort((a,b) => dist(a.x,a.y,500,388.75) - dist(b.x,b.y,500,388.75))[0];
      jumpBallState.tipTarget = nearest;

      // ボールを味方に向かってタップ
      let ang = atan2(nearest.y - 388.75, nearest.x - 500);
      ball.vx = cos(ang) * 5;
      ball.vy = sin(ang) * 5;
      ball.vz = -1.5;
      ball.lastTouch = winner.team;

      addFloatingText(500, 330, winner.team === "PlayerTeam" ? "BLUE TIP!" : "RED TIP!",
        winner.team === "PlayerTeam" ? [0,200,255] : [255,100,100]);
      jumpBallState.phase = 3;
      jumpBallState.timer = 0;
    }
  }
  else if(jumpBallState.phase === 3) {
    // 両者着地しつつボール飛行
    j1.z = max(0, j1.z - 2.5);
    j2.z = max(0, j2.z - 2.5);
    if(j1.z <= 0) { j1.z = 0; j1.isJumping = false; }
    if(j2.z <= 0) { j2.z = 0; j2.isJumping = false; }

    // ボール物理
    ball.vz -= BALL_GRAVITY * 0.4;
    ball.x += ball.vx;
    ball.y += ball.vy;
    ball.z += ball.vz;

    if(ball.z <= 0) { ball.z = 0; ball.vz *= -0.4; ball.vx *= 0.8; ball.vy *= 0.8; }

    // タップターゲットがキャッチ、または誰かが拾う
    let target = jumpBallState.tipTarget;
    if(target && dist(target.x, target.y, ball.x, ball.y) < 40 && ball.z < 50) {
      target.hasBall = true;
      possession = target.team;
      shotClock = 24;
      jumpBallState = null;
      return;
    }

    // ルーズボール拾い（タイムアウト安全策）
    if(t > 90 || (ball.z < 15 && abs(ball.vz) < 0.5)) {
      let nearest = players.reduce((c, p) => dist(p.x,p.y,ball.x,ball.y) < dist(c.x,c.y,ball.x,ball.y) ? p : c);
      nearest.hasBall = true;
      possession = nearest.team;
      shotClock = 24;
      jumpBallState = null;
    }
  }
}

function checkRebound(side) {
  let rx = side === 1 ? finalGoal.ringX : 1000 - finalGoal.ringX, ry = finalGoal.ringY, rz = finalGoal.ringZ, rs = finalGoal.ringSize / 2;

  // バックボードの正確な位置（パースを考慮）
  let g = finalGoal;
  let bPts = g.board.map(pt=>({x:side===1?pt.x:1000-pt.x, y:pt.y-95}));

  // バックボードのX位置の範囲（左右の端）
  let boardXMin = side === 1 ? bPts[3].x : bPts[0].x;
  let boardXMax = side === 1 ? bPts[0].x : bPts[3].x;
  let boardYMin = bPts[0].y;
  let boardYMax = bPts[1].y;

  // バックボードの中心X位置（跳ね返りの基準）
  let boardCenterX = (boardXMin + boardXMax) / 2;

  // バックボードとの衝突判定
  let boardFaceX = side === 1 ? min(boardXMin, boardXMax) : max(boardXMin, boardXMax);
  let isApproachingBoard = side === 1 ? ball.vx > 0 : ball.vx < 0;

  if(isApproachingBoard &&
     abs(ball.x - boardFaceX) < 12 &&
     ball.y > boardYMin - 8 &&
     ball.y < boardYMax + 8 &&
     ball.z > 70 && ball.z < 170) {

    // 跳ね返り（コート内側に跳ね返す）
    ball.vz *= 0.8;
    ball.vy *= 0.85;

    if(side === 1) {
      ball.vx = -abs(ball.vx) * 0.65;
      ball.x = boardFaceX - 10;
    } else {
      ball.vx = abs(ball.vx) * 0.65;
      ball.x = boardFaceX + 10;
    }
  }

  // リングとの衝突判定（リム部分のみ、通過部分を広く）
  let d = dist(ball.x, ball.y, rx, ry);
  if(abs(ball.z - rz) < 8 && d > rs - 3 && d < rs + 6) {
    let ang = atan2(ball.y - ry, ball.x - rx), spH = sqrt(ball.vx*ball.vx + ball.vy*ball.vy);
    ball.vx = cos(ang) * (spH * BOUNCE_FACTOR + 1.0);
    ball.vy = sin(ang) * (spH * BOUNCE_FACTOR + 1.0);
    ball.vz = ball.vz < 0 ? abs(ball.vz) * BOUNCE_FACTOR + 1.0 : ball.vz * BOUNCE_FACTOR;
    goalChecked = false;
  }
}

function updatePhysics() {
  if(throwInState) return;
  let holder = players.find(p => p.hasBall);
  if(holder) {
    // ドリブル：進行方向の前方でバウンドさせる
    let dZ = holder.isJumping ? 0 : abs(sin(holder.dribblePhase)) * 22;
    let dribbleOffsetX = 0, dribbleOffsetY = 0;
    if(!holder.isJumping && holder.currentSpeed > 0.3) {
      // 移動中は進行方向の前にボールを置く
      dribbleOffsetX = cos(holder.facingAngle) * 10;
      dribbleOffsetY = sin(holder.facingAngle) * 5; // パース補正（Y方向は半分）
    }
    ball.x = holder.x + dribbleOffsetX; ball.y = holder.y + dribbleOffsetY;
    ball.z = holder.z + 45 - dZ;
    ball.vx = 0; ball.vy = 0; ball.vz = 0; ball.passTarget = null; ball.lastTouch = holder.team;
  } else {
    // 重力の適用
    ball.vz -= BALL_GRAVITY * 0.5;

    // 空気抵抗の適用
    ball.vx *= AIR_RESISTANCE;
    ball.vy *= AIR_RESISTANCE;
    ball.vz *= AIR_RESISTANCE;

    // 位置の更新
    ball.x += ball.vx * 0.5;
    ball.y += ball.vy * 0.5;
    ball.z += ball.vz * 0.5;

    // パスターゲットへのキャッチ判定
    if(ball.passTarget !== null) {
      let rcv = players[ball.passTarget];
      if(rcv && dist(rcv.x, rcv.y, ball.x, ball.y) < 35 && ball.z < 60) {
        rcv.hasBall = true;
        ball.passTarget = null;
      }
    }

    // 地面との衝突
    if(ball.z <= 0) {
      ball.z = 0;
      ball.vz *= -0.55;
      ball.vx *= 0.95;
      ball.vy *= 0.95;
      goalChecked = false;
    }

    checkRebound(1); checkRebound(-1);
    
    let oob = false, thX = ball.x, thY = ball.y;
    if(ball.y < 250 || ball.y > 562.5) { oob = true; thY = ball.y < 250 ? 256.25 : 556.25; thX = constrain(ball.x, 62.5, 937.5); }
    if(ball.x < 12.5 || ball.x > 987.5) { oob = true; thX = ball.x < 12.5 ? 18.75 : 981.25; thY = constrain(ball.y, 275, 537.5); }
    if(oob && ball.z < 30) {
      let newTeam = ball.lastTouch === "PlayerTeam" ? "DefenderTeam" : "PlayerTeam";
      startThrowIn(newTeam, thX, thY, "OUT OF BOUNDS");
      addFloatingText(500, 375, "OUT OF BOUNDS", [255,255,255]);
    }
  }
  netRight.offsetX *= NET_DAMPING; netRight.swing *= NET_DAMPING; netRight.phase += 0.08;
  netLeft.offsetX *= NET_DAMPING; netLeft.swing *= NET_DAMPING; netLeft.phase += 0.08;
  checkGoal(1, netRight); checkGoal(-1, netLeft);
}

function checkGoal(side, net) {
  let rx = side === 1 ? finalGoal.ringX : 1000 - finalGoal.ringX;
  let d = dist(ball.x, ball.y, rx, finalGoal.ringY);
  if(ball.vz < 0 && ball.z < finalGoal.ringZ && ball.z > finalGoal.ringZ - 25 && d < finalGoal.ringSize * 0.55) {
    net.offsetX = ball.vx * 1.5; net.swing = 10; net.phase = 0;
    // 網による減速
    ball.vz *= 0.65;
    if(!goalChecked && ball.z < finalGoal.ringZ - 5) {
      let pts = ball.is3pt ? 3 : 2;
      if(side === 1) {
        scorePlayer += pts;
        quarterScoresPlayer[quarter - 1] += pts;
      } else {
        scoreDefender += pts;
        quarterScoresDefender[quarter - 1] += pts;
      }
      goalChecked = true;
      for(let i=0;i<30;i++) particles.push({x:rx,y:finalGoal.ringY,vx:random(-5,5),vy:random(-5,5),life:60,color:side===1?[0,150,255]:[255,50,50]});
      addFloatingText(rx, finalGoal.ringY - 50, ball.is3pt ? "+3!" : "+2!", side===1?[0,200,255]:[255,100,100]);
      let newTeam = side === 1 ? "DefenderTeam" : "PlayerTeam";
      let thX = side === 1 ? 975 : 25;

      // ゴール後：新しい守備側は素早く自陣に戻る
      players.forEach(p => {
        if(p.team === newTeam) {
          p.returningToDefense = true;
        }
      });

      setTimeout(() => {
        startThrowIn(newTeam, thX, 406.25, "INBOUND");
        players.forEach(p => p.returningToDefense = false);
      }, 1000);
    }
  }
}

function updateParticles() {
  for(let i=particles.length-1; i>=0; i--) {
    let p = particles[i]; p.x += p.vx; p.y += p.vy; p.vy += 0.1; p.life--;
    noStroke(); fill(p.color[0],p.color[1],p.color[2],p.life*4);
    ellipse(p.x, p.y, map(p.life,0,60,2,8));
    if(p.life <= 0) particles.splice(i,1);
  }
}

function addFloatingText(x, y, txt, col) { floatingTexts.push({x,y,txt,col,life:60}); }

function updateFloatingTexts() {
  for(let i=floatingTexts.length-1; i>=0; i--) {
    let t = floatingTexts[i]; t.y -= 1; t.life--;
    fill(t.col[0],t.col[1],t.col[2],t.life*4);
    noStroke(); textSize(16); textStyle(BOLD); textAlign(CENTER); text(t.txt, t.x, t.y);
    if(t.life <= 0) floatingTexts.splice(i,1);
  }
}

function drawEntity(x, y, z, s, c, isBall) {
  noStroke(); fill(0, 50); ellipse(x, y, s * 1.2, s * 0.5);
  fill(c); stroke(255); strokeWeight(1); ellipse(x, y - z, s, s);
  if(isBall) { stroke(0,50); strokeWeight(1); line(x-s/3, y-z, x+s/3, y-z); }
}

function drawCourtAndBackboard() {
  // 体育館風の木製床を描画
  drawGymnasiumFloor();

  // 3Pライン（奥側を少し薄く）
  stroke(255,200,0,100); strokeWeight(4);
  drawSpline(p7); drawSpline(p7.map(pt=>({x:1000-pt.x,y:pt.y})));

  // コートライン
  noFill(); stroke(255); strokeWeight(2);
  line(500,250,500,562.5);
  ellipse(500, cCircle.centerCircleY, cCircle.centerCircleW, cCircle.centerCircleH);

  // ペイントエリア
  drawPaintSet(1); drawPaintSet(-1);

  // 3Pライン（手前側を濃く）
  stroke(255); strokeWeight(2);
  drawSpline(p7); drawSpline(p7.map(pt=>({x:1000-pt.x,y:pt.y})));

  // 電子スコアボード（コート奥側）
  drawScoreboard();

  // バックボードと支柱
  renderBackboardAndPole(1); renderBackboardAndPole(-1);
}

// 体育館風の木製床を描画
function drawGymnasiumFloor() {
  // コート外枠
  stroke(100,80,60); strokeWeight(3);
  fill(160,130,90);
  beginShape();
  for(let pt of [court.tl,court.tr,court.br,court.bl]) vertex(pt.x,pt.y);
  endShape(CLOSE);

  // 木目調の床板（横方向）
  noStroke();
  let boardWidth = 25; // 床板1枚の幅
  for(let y = court.tl.y; y < court.br.y; y += boardWidth) {
    // 交互に明暗をつける
    let brightness = (floor(y / boardWidth) % 2 === 0) ? 0 : 10;
    fill(165 + brightness, 135 + brightness, 95 + brightness);

    // パースペクティブに合わせて板の幅を調整（奥ほど狭く見える）
    let ratio = map(y, court.tl.y, court.br.y, 0.7, 1.0);
    let actualWidth = boardWidth * ratio;

    // 台形状に描画
    let x1 = map(y, court.tl.y, court.bl.y, court.tl.x, court.bl.x);
    let x2 = map(y, court.tr.y, court.br.y, court.tr.x, court.br.x);
    let x1Next = map(y + actualWidth, court.tl.y, court.bl.y, court.tl.x, court.bl.x);
    let x2Next = map(y + actualWidth, court.tr.y, court.br.y, court.tr.x, court.br.x);

    beginShape();
    vertex(x1, y);
    vertex(x2, y);
    vertex(x2Next, y + actualWidth);
    vertex(x1Next, y + actualWidth);
    endShape(CLOSE);

    // 板の継ぎ目
    stroke(140, 110, 75, 80);
    strokeWeight(1);
    line(x1Next, y + actualWidth, x2Next, y + actualWidth);
  }

  // 外周ライン
  noFill();
  stroke(255);
  strokeWeight(3);
  beginShape();
  for(let pt of [court.tl,court.tr,court.br,court.bl]) vertex(pt.x,pt.y);
  endShape(CLOSE);
}

// 電子スコアボード（コート奥側に配置）
function drawScoreboard() {
  // スコアボードの位置（コート中央上部、奥側）
  let sbX = 500;
  let sbY = 165;
  let sbWidth = 460;
  let sbHeight = 110;

  // スコアボードの影
  noStroke();
  fill(0, 0, 0, 40);
  rect(sbX - sbWidth/2 + 5, sbY - sbHeight/2 + 5, sbWidth, sbHeight, 4);

  // スコアボードの外枠（黒いフレーム）
  fill(20, 20, 25);
  stroke(40, 40, 50);
  strokeWeight(3);
  rect(sbX - sbWidth/2, sbY - sbHeight/2, sbWidth, sbHeight, 4);

  // 内側のパネル（ダークグレー）
  fill(30, 30, 35);
  noStroke();
  rect(sbX - sbWidth/2 + 5, sbY - sbHeight/2 + 5, sbWidth - 10, sbHeight - 10, 2);

  // 上部：チーム名と時間表示（RED 20:14 BLUE形式）
  textAlign(CENTER, CENTER);
  textFont('sans-serif');
  textSize(14);

  // RED（左）
  fill(255, 100, 100);
  text("RED", sbX - 120, sbY - 40);

  // 時間表示（中央）
  fill(200, 200, 220);
  let minutes = floor(gameTime / 60);
  let seconds = gameTime % 60;
  text(minutes.toString().padStart(2, '0') + ":" + seconds.toString().padStart(2, '0'), sbX, sbY - 40);

  // BLUE（右）
  fill(0, 255, 255);
  text("BLUE", sbX + 120, sbY - 40);

  // 大きなスコア表示（LED風）
  textSize(52);
  textFont('monospace');

  // REDスコア（左側、大きく）
  fill(255, 50, 50, 230);
  stroke(200, 40, 40);
  strokeWeight(2);
  text(scoreDefender, sbX - 120, sbY + 5);

  // BLUEスコア（右側、大きく）
  fill(0, 255, 255, 230);
  stroke(0, 200, 200);
  strokeWeight(2);
  text(scorePlayer, sbX + 120, sbY + 5);

  // 中央下部：クォーター別スコア（縦4行）
  textSize(10);
  textFont('sans-serif');
  noStroke();

  let qX = sbX; // 中央に配置
  let qStartY = sbY + 30;
  let qSpacing = 12;

  for(let i = 0; i < 4; i++) {
    let qY = qStartY + i * qSpacing;

    // REDスコア（左）
    let redColor = i === quarter - 1 ? [255, 100, 100] : [150, 80, 80];
    fill(redColor[0], redColor[1], redColor[2]);
    textAlign(RIGHT, CENTER);
    text(quarterScoresDefender[i], qX - 15, qY);

    // クォーター番号と横棒
    fill(100, 100, 110);
    textAlign(CENTER, CENTER);
    text("-", qX, qY);

    // BLUEスコア（右）
    let blueColor = i === quarter - 1 ? [0, 255, 255] : [80, 130, 130];
    fill(blueColor[0], blueColor[1], blueColor[2]);
    textAlign(LEFT, CENTER);
    text(quarterScoresPlayer[i], qX + 15, qY);
  }

  textFont('sans-serif');
  textAlign(LEFT, TOP);
}

function drawPaintSet(side) {
  let pts = paintData.paintPoints.map(pt => side===1 ? pt : {x:1000-pt.x,y:pt.y});
  stroke(255); strokeWeight(2); fill(180,100,100,30);
  beginShape(); for(let pt of pts) vertex(pt.x,pt.y); endShape(CLOSE);
  noFill();
  let cX = side===1 ? paintData.ftCircle.x : 1000-paintData.ftCircle.x;
  arc(cX, paintData.ftCircle.y, paintData.ftCircle.w, paintData.ftCircle.h, side===1?HALF_PI:-HALF_PI, side===1?-HALF_PI:HALF_PI);
}

function drawSpline(pts) {
  beginShape(); curveVertex(pts[0].x,pts[0].y);
  for(let pt of pts) curveVertex(pt.x,pt.y);
  curveVertex(pts[pts.length-1].x,pts[pts.length-1].y); endShape();
}

function renderBackboardAndPole(side) {
  let g = finalGoal;
  let poleBaseX = side===1 ? g.poleBaseX : 1000-g.poleBaseX;
  let poleBaseY = g.poleBaseY;
  let poleTopY = poleBaseY - 95;

  // 支柱（立体的な円柱）
  // 支柱の影
  noStroke();
  fill(0, 0, 0, 30);
  ellipse(poleBaseX + 2, poleBaseY + 3, 14, 8);

  // 支柱本体（グラデーション効果）
  for(let i = 0; i < 10; i++) {
    let offset = map(i, 0, 10, -5, 5);
    let brightness = map(abs(offset), 0, 5, 120, 80);
    stroke(brightness, brightness - 10, brightness - 20);
    strokeWeight(1);
    line(poleBaseX + offset, poleBaseY, poleBaseX + offset, poleTopY);
  }

  // 支柱の輪郭
  stroke(60, 60, 70);
  strokeWeight(2);
  line(poleBaseX - 5, poleBaseY, poleBaseX - 5, poleTopY);
  line(poleBaseX + 5, poleBaseY, poleBaseX + 5, poleTopY);

  // 支柱上部のキャップ
  fill(80, 80, 90);
  stroke(50, 50, 60);
  strokeWeight(1);
  ellipse(poleBaseX, poleTopY, 12, 7);

  // バックボードの取り付けアーム
  let armStartX = poleBaseX;
  let armStartY = poleTopY + 10;
  let armEndX = side===1 ? g.board[0].x - 10 : 1000 - g.board[0].x + 10;
  let armEndY = g.board[0].y - 95;

  stroke(70, 70, 80);
  strokeWeight(4);
  line(armStartX, armStartY, armEndX, armEndY);

  // バックボードの影
  noStroke();
  fill(0, 0, 0, 20);
  let bPtsShadow = g.board.map(pt=>({x:(side===1?pt.x:1000-pt.x) + 3, y:pt.y-92}));
  beginShape();
  for(let pt of bPtsShadow) vertex(pt.x, pt.y);
  endShape(CLOSE);

  // バックボードの厚み（側面）
  let bPts = g.board.map(pt=>({x:side===1?pt.x:1000-pt.x, y:pt.y-95}));
  fill(220, 220, 220);
  stroke(100, 100, 100);
  strokeWeight(1);
  beginShape();
  vertex(bPts[0].x, bPts[0].y);
  vertex(bPts[0].x + (side===1 ? -3 : 3), bPts[0].y - 2);
  vertex(bPts[3].x + (side===1 ? -3 : 3), bPts[3].y - 2);
  vertex(bPts[3].x, bPts[3].y);
  endShape(CLOSE);

  // バックボード本体（白色）
  fill(255, 255, 255);
  stroke(0, 0, 0);
  strokeWeight(3);
  beginShape();
  for(let pt of bPts) vertex(pt.x, pt.y);
  endShape(CLOSE);

  // バックボードのウィンドウ（外枠を小さくした形）
  // パースペクティブを守った台形状のウィンドウ
  noFill();
  stroke(0, 0, 0);
  strokeWeight(2);

  // ウィンドウは外枠を0.4倍に縮小したサイズ
  let scale = 0.4;
  let centerX = (bPts[0].x + bPts[1].x + bPts[2].x + bPts[3].x) / 4;
  let centerY = (bPts[0].y + bPts[1].y + bPts[2].y + bPts[3].y) / 4;

  beginShape();
  for(let pt of bPts) {
    let wx = centerX + (pt.x - centerX) * scale;
    let wy = centerY + (pt.y - centerY) * scale;
    vertex(wx, wy);
  }
  endShape(CLOSE);

  // バックボードの反射光
  noStroke();
  fill(255, 255, 255, 40);
  beginShape();
  vertex(bPts[0].x, bPts[0].y);
  vertex(bPts[0].x + (bPts[1].x - bPts[0].x) * 0.3, bPts[0].y);
  vertex(bPts[0].x + (bPts[1].x - bPts[0].x) * 0.3, bPts[0].y + (bPts[1].y - bPts[0].y) * 0.4);
  vertex(bPts[0].x, bPts[0].y + (bPts[1].y - bPts[0].y) * 0.4);
  endShape(CLOSE);
}

function drawNetGemini(rx,ry,rz,net,isBack) {
  let swX = (net.offsetX + sin(net.phase)*net.swing)*0.8;
  let seg = 4, vL = 12; stroke(255,180); strokeWeight(1); noFill();
  for(let j=0; j<vL; j++) {
    let ang = map(j,0,vL,0,TWO_PI);
    if(isBack && ang > 0 && ang < PI) continue;
    if(!isBack && ang >= PI && ang <= TWO_PI) continue;
    beginShape();
    for(let i=0; i<=seg; i++) {
      let pr = i/seg, w = (finalGoal.ringSize/2)*(1-pr*0.3), h = (finalGoal.ringSize*0.2)*(1-pr*0.3);
      vertex(rx+cos(ang)*w+(swX*pr), ry-rz+i*4.5+sin(ang)*h);
    } endShape();
  }
  let sA = isBack ? PI : 0, eA = isBack ? TWO_PI : PI;
  for(let i=1; i<=seg; i++) {
    let pr = i/seg, w = finalGoal.ringSize*(1-pr*0.3), h = finalGoal.ringSize*0.4*(1-pr*0.3);
    arc(rx+(swX*pr), ry-rz+i*4.5, w, h, sA, eA);
  }
}

function renderGoalBack(side, net) {
  let g = finalGoal, rx = side===1 ? g.ringX : 1000-g.ringX;
  noStroke(); fill(0,40); ellipse(rx,g.ringY,g.ringSize,g.ringSize*0.4);
  stroke(255,50,50); strokeWeight(3); noFill();
  arc(rx, g.ringY-g.ringZ, g.ringSize, g.ringSize*0.4, PI, TWO_PI);
  drawNetGemini(rx, g.ringY, g.ringZ, net, true);
}

function renderGoalFront(side, net) {
  let g = finalGoal, rx = side===1 ? g.ringX : 1000-g.ringX;
  stroke(255,50,50); strokeWeight(3); noFill();
  arc(rx, g.ringY-g.ringZ, g.ringSize, g.ringSize*0.4, 0, PI);
  drawNetGemini(rx, g.ringY, g.ringZ, net, false);
}

function setGameSpeed(speed) {
  gameSpeed = speed;
  // ボタンのアクティブ状態を更新
  document.querySelectorAll('.speed-btn').forEach(btn => {
    btn.classList.remove('active');
  });
  event.target.classList.add('active');
}
